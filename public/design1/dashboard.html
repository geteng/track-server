<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日概览 — airU 销售工作台</title>
<link rel="stylesheet" href="./shared.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .stats-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
  .dash-cols { display: grid; grid-template-columns: 360px 1fr; gap: 16px; align-items: start; margin-bottom: 20px; }
  .summary-item {
    display: flex; gap: 12px; padding: 12px 14px; border-radius: 6px;
    background: rgba(255,255,255,0.02); border: 1px solid var(--border);
    margin-bottom: 10px; align-items: flex-start;
    text-decoration: none; color: inherit; cursor: pointer;
    transition: all 0.2s;
  }
  .summary-item:last-child { margin-bottom: 0; }
  .summary-item:hover { border-color: rgba(200,169,81,0.4); background: rgba(200,169,81,0.05); transform: translateX(2px); }
  .summary-num {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: var(--gold-grad); color: #4A3A0F;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .summary-text { font-size: 13px; line-height: 1.6; color: var(--fg-muted); }
  .user-meta { font-size: 11px; color: var(--fg-weak); margin-top: 2px; font-family: monospace; }
  .op-btns { display: flex; gap: 6px; justify-content: flex-end; }
</style>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <a class="sidebar-logo" href="./dashboard.html">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.57a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.57a2 2 0 0 0-1.34-2.23z"/></svg>
      </div>
      <div class="logo-text"><span class="logo-name">airU</span><span class="logo-sub">销售工作台</span></div>
    </a>
    <nav class="sidebar-nav">
      <div class="nav-section-label">工作台</div>
      <a href="./dashboard.html" class="nav-item active">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        <span>今日概览</span>
      </a>
      <a href="./users.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>高意向用户</span>
        <span class="nav-badge" id="navHotCnt">-</span>
      </a>
      <a href="./behavior.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        <span>行为日志</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar">张</div>
        <div class="sidebar-user-info"><div class="sidebar-user-name">张店长</div><div class="sidebar-user-role">门店管理员</div></div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <h1 class="topbar-title">今日概览</h1>
      <div class="topbar-actions">
        <div class="topbar-date" id="nowText">-</div>
        <button class="btn btn-outline btn-sm" onclick="load()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
          刷新
        </button>
      </div>
    </header>

    <main class="content">

      <!-- 6 个统计磁贴 -->
      <div class="stats-cols" id="statsRow">
        <a class="stat-card" data-href="./users.html?tab=hot"><div class="stat-label">🔥 今日高意向用户</div><div class="stat-value" id="st1">—</div><div class="stat-sub" id="st1d"></div><span class="go-arrow">→</span></a>
        <a class="stat-card" data-href="./users.html?tab=followup"><div class="stat-label">📌 待跟进任务</div><div class="stat-value" id="st2">—</div><div class="stat-sub" id="st2d"></div><span class="go-arrow">→</span></a>
        <a class="stat-card" data-href="./users.html?tab=crosssell"><div class="stat-label">🛍️ 连带销售机会金额</div><div class="stat-value" id="st3">—</div><div class="stat-sub" id="st3d"></div><span class="go-arrow">→</span></a>
        <a class="stat-card" data-href="./users.html?tab=followup"><div class="stat-label">💬 今日已联系用户</div><div class="stat-value" id="st4">—</div><div class="stat-sub">来自跟进任务完成</div><span class="go-arrow">→</span></a>
        <a class="stat-card" data-href="./users.html?tab=all"><div class="stat-label">📈 本周转化率</div><div class="stat-value" id="st5">—</div><div class="stat-sub">待接入订单数据</div><span class="go-arrow">→</span></a>
        <a class="stat-card" data-href="./users.html?tab=crosssell"><div class="stat-label">💰 本月连带销售金额</div><div class="stat-value" id="st6">—</div><div class="stat-sub">潜在成交口径</div><span class="go-arrow">→</span></a>
      </div>

      <!-- 今日行动摘要 + 今日重点跟进 -->
      <div class="dash-cols">
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
              今日行动摘要
            </div>
            <span class="badge badge-gold">AI 生成</span>
          </div>
          <div class="card-body" id="summaryList"><div class="loading">加载中…</div></div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
              今日重点用户
            </div>
            <a class="btn btn-ghost btn-sm" href="./users.html?tab=hot">查看全部 →</a>
          </div>
          <div class="card-body" style="padding:0;">
            <div class="table-wrap">
            <table>
              <thead><tr><th>用户</th><th>今日信号</th><th>优先级</th><th>行为</th><th style="text-align:right;">操作</th></tr></thead>
              <tbody id="hotBody"><tr><td colspan="5" class="loading">加载中…</td></tr></tbody>
            </table>
            </div>
          </div>
        </div>
      </div>

      <!-- 连带销售机会 -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            连带销售机会
          </div>
          <a class="btn btn-ghost btn-sm" href="./users.html?tab=crosssell">查看全部 →</a>
        </div>
        <div class="card-body">
          <div class="grid-3" id="crossGrid"><div class="loading">加载中…</div></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(n){ return '¥' + Number(n || 0).toLocaleString(); }
function fmtTime(ts){ const d = new Date(ts); const p = x => String(x).padStart(2,'0'); return `${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`; }

setInterval(() => {
  const d = new Date(); const p = x => String(x).padStart(2,'0');
  document.getElementById('nowText').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 周${'日一二三四五六'[d.getDay()]} ${p(d.getHours())}:${p(d.getMinutes())}`;
}, 1000);

function pillScore(p){
  if (p >= 100) return '<span class="pill-score pill-red">🔥 ' + p + '</span>';
  if (p >= 60)  return '<span class="pill-score pill-amber">' + p + '</span>';
  if (p >= 30)  return '<span class="pill-score pill-blue">' + p + '</span>';
  return '<span class="pill-score pill-gray">' + p + '</span>';
}
function sigsOf(u){
  const s = [];
  if (u.isHeatingUp) s.push('<span class="sig sig-hot">⚡ 正在升温</span>');
  if (u.collectedLooks > 0) s.push('<span class="sig sig-gold">收藏 ' + u.collectedLooks + '</span>');
  if (u.viewedSkus > 0) s.push('<span class="sig sig-ok">浏览商品 ' + u.viewedSkus + '</span>');
  if (u.crosssellScore > 0) s.push('<span class="sig sig-info">连带 ¥' + Number(u.crosssellAmount||0).toLocaleString() + '</span>');
  if (!s.length) s.push('<span class="sig sig-gray">近 48h 活跃</span>');
  return s.join('');
}
function goDetail(key){ location.href = './user-detail.html?key=' + encodeURIComponent(key); }
function openFollow(key, name){ location.href = './users.html?tab=followup&fu=' + encodeURIComponent(key) + '&name=' + encodeURIComponent(name); }

async function load() {
  try {
    const [hotRes, crossRes, sumRes, fuRes] = await Promise.all([
      fetch('/api/intent/users?tab=hot&size=6').then(r => r.json()),
      fetch('/api/intent/users?tab=crosssell&size=3').then(r => r.json()),
      fetch('/api/intent/action-summary').then(r => r.json()),
      fetch('/api/follow-ups?status=all').then(r => r.json()),
    ]);
    const hot = hotRes.data || { list: [], summary: {} };
    const hotList = hot.list || [];
    const summary = hot.summary || {};
    const crossList = (crossRes.data && crossRes.data.list) || [];
    const items = (sumRes.data && sumRes.data.items) || [];
    const fus = (fuRes.data) || [];
    const doneCnt = fus.filter(f => f.status === 'done').length;

    // 侧栏徽标
    document.getElementById('navHotCnt').textContent = hotRes.data.total;

    // 磁贴
    const pending = fus.filter(f => f.status === 'pending');
    document.getElementById('st1').textContent = summary.hotUsers != null ? summary.hotUsers : hotList.length;
    document.getElementById('st1d').textContent = hotList[0] ? hotList[0].displayName + ' · 优先级 ' + hotList[0].priority : (hotList.length ? '' : '暂无重点用户');
    document.getElementById('st2').textContent = summary.pendingFollowUps != null ? summary.pendingFollowUps : pending.length;
    document.getElementById('st2d').textContent = pending[0] ? '最近：' + pending[0].display_name + ' · ' + pending[0].plan_time : '';
    document.getElementById('st3').textContent = fmtMoney(summary.crosssellTotal);
    document.getElementById('st3d').textContent = crossList[0] ? '最高：' + crossList[0].displayName + ' ' + fmtMoney(crossList[0].crosssellAmount) : '';
    document.getElementById('st4').textContent = doneCnt;
    document.getElementById('st5').textContent = '—';
    document.getElementById('st6').textContent = fmtMoney(summary.monthCrossSell);

    // 行动摘要
    document.getElementById('summaryList').innerHTML = items.length
      ? items.map((it, i) => {
          const href = it.key ? './user-detail.html?key=' + encodeURIComponent(it.key) : './users.html?tab=all';
          return '<a class="summary-item" href="' + href + '"><div class="summary-num">' + (i + 1) + '</div><div class="summary-text">' + esc(it.text) + '</div></a>';
        }).join('')
      : '<div class="empty">暂无摘要</div>';

    // 今日重点表
    document.getElementById('hotBody').innerHTML = hotList.length
      ? hotList.map(u => `
        <tr class="row-click" onclick="goDetail('${encodeURIComponent(u.key)}')">
          <td><div class="u-cell"><div class="u-avatar">${esc(u.displayName[0])}</div><div><div class="u-name">${esc(u.displayName)}</div><div class="user-meta">${esc(u.aid || '—')} · ${u.behaviorCount} 次行为</div></div></div></td>
          <td>${sigsOf(u)}</td>
          <td>${pillScore(u.priority)}<div class="bar-wrap"><div class="bar-fill" style="width:${Math.min(100, u.priority)}%"></div></div></td>
          <td>${u.behaviorCount}</td>
          <td><div class="op-btns">
            <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();goDetail('${encodeURIComponent(u.key)}')">详情</button>
            <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();openFollow('${encodeURIComponent(u.key)}','${esc(u.displayName)}')">预约跟进</button>
          </div></td>
        </tr>`).join('')
      : '<tr><td colspan="5"><div class="empty">「今日重点」暂无用户，最近 48 小时无高意向行为</div></td></tr>';

    // 连带机会
    document.getElementById('crossGrid').innerHTML = crossList.length
      ? crossList.map(u => `
        <div class="card" style="cursor:pointer;" onclick="goDetail('${encodeURIComponent(u.key)}')">
          <div class="card-body">
            <div class="flex justify-between items-center mb-4">
              <div class="u-cell"><div class="u-avatar">${esc(u.displayName[0])}</div><div><div class="u-name">${esc(u.displayName)}</div><div class="user-meta">${esc(u.aid || '—')}</div></div></div>
              <span class="badge badge-gold">连带 ${u.crosssellScore} 分</span>
            </div>
            <div style="font-size:22px;font-weight:700;" class="text-gold mb-4">${fmtMoney(u.crosssellAmount)}</div>
            <div style="font-size:12px;color:var(--fg-muted);line-height:1.6;">${esc((u.crosssellReasons || []).join(' · ') || '—')}</div>
            <div class="mt-4 flex gap-2">
              <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();goDetail('${encodeURIComponent(u.key)}')">查看工作台</button>
              <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openFollow('${encodeURIComponent(u.key)}','${esc(u.displayName)}')">预约</button>
            </div>
          </div>
        </div>`).join('')
      : '<div class="empty">暂无连带销售机会</div>';
  } catch (e) {
    console.error(e);
    document.getElementById('summaryList').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
