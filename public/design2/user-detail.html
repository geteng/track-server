<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户详情 — airU 销售工作台</title>
<link rel="stylesheet" href="./shared.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .detail-cols { display: grid; grid-template-columns: 1fr 380px; gap: 20px; align-items: start; }
  .left-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .card.full { grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <a class="sidebar-logo" href="./dashboard.html">
      <img src="https://xla-persist.xingliu.art/wm/artifacts/agent/sUAa5B7d5JFovIE8.png" alt="airU logo" onerror="this.outerHTML='<span style=&quot;width:32px;height:32px;border-radius:8px;background:var(--data-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;&quot;>U</span>'">
      <span class="sidebar-logo-text">airU 销售工作台</span>
    </a>
    <nav class="sidebar-nav">
      <div class="nav-section">工作台</div>
      <a href="./dashboard.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        今日概览
      </a>
      <a href="./users.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        高意向用户
        <span class="nav-badge" id="navHotCnt">-</span>
      </a>
      <a href="./behavior.html" class="nav-item m-nav-hide">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        行为日志
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar">张</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">张店长</div>
          <div class="sidebar-user-role">门店管理员</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <h1 class="topbar-title" id="pageTitle">用户详情</h1>
      <div class="topbar-search" style="display:none;"></div>
      <div class="topbar-icon-btn" title="通知">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notif-dot"></span>
      </div>
      <div class="topbar-avatar" title="张店长">张</div>
    </header>

    <main class="content">

      <!-- Breadcrumb -->
      <div class="breadcrumb">
        <a href="./dashboard.html">工作台</a>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        <a href="./users.html">高意向用户</a>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        <span class="current" id="bcName">详情</span>
      </div>

      <!-- 用户头部卡片 -->
      <div class="user-info-card" id="headerBox"><div class="loading" style="width:100%;"><span class="spinner"></span>加载用户信息…</div></div>

      <div class="detail-cols" id="content" style="visibility:hidden;">
        <!-- 左列 -->
        <div class="left-cols">
          <div class="card full">
            <div class="card-header">
              <div class="card-title">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                最近行为时间线
              </div>
              <span class="badge badge-blue" id="tlCnt">-</span>
            </div>
            <div class="card-body" id="timelineBox"><div class="loading">加载中…</div></div>
          </div>

          <div class="card full">
            <div class="card-header">
              <div class="card-title">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                评分构成
              </div>
            </div>
            <div class="card-body" id="scoreBox"><div class="loading">加载中…</div></div>
          </div>
        </div>

        <!-- 右列 -->
        <div>
          <div class="card mb-4">
            <div class="card-header">
              <div class="card-title">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                推荐跟进动作
              </div>
            </div>
            <div class="card-body" id="scriptBox"><div class="loading">加载中…</div></div>
          </div>

          <div class="card mb-4" id="upsellBox">
            <div class="card-header">
              <div class="card-title">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                连带销售机会
              </div>
              <span class="badge badge-success" id="crossBadge">-</span>
            </div>
            <div class="card-body" id="crossBody"><div class="empty">暂无</div></div>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-title">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                跟进记录
              </div>
              <button class="btn btn-primary btn-sm" onclick="openFollowModal()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                预约跟进
              </button>
            </div>
            <div class="card-body" id="fuBox"><div class="empty">暂无跟进记录</div></div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- 预约跟进 Modal -->
<div class="modal-overlay" id="fuModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">预约跟进</div>
      <button class="modal-close" onclick="document.getElementById('fuModal').classList.remove('open')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">跟进对象</label>
        <input class="form-input" id="fuUser" readonly>
      </div>
      <div class="form-group">
        <label class="form-label">跟进人员</label>
        <select class="form-select" id="fuOwner">
          <option value="">请选择</option>
          <option>小林</option>
          <option>小付</option>
          <option>小陈</option>
          <option>小葛</option>
          <option>林老师</option>
          <option>赵老师</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">跟进时间</label>
        <select class="form-select" id="fuPlanTime">
          <option value="">请选择</option>
          <option>今天下午</option>
          <option>明天上午</option>
          <option>明天下午</option>
          <option>后天</option>
          <option>本周内</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">备注</label>
        <textarea class="form-textarea" id="fuNote" placeholder="请输入跟进备注..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="document.getElementById('fuModal').classList.remove('open')">取消</button>
      <button class="btn btn-primary" onclick="submitFollow()">确认预约</button>
    </div>
  </div>
</div>

<script>
let U = null;
const AV_COLORS = [
  'linear-gradient(135deg,#2563EB,#3B82F6)','linear-gradient(135deg,#8B5CF6,#7C3AED)','linear-gradient(135deg,#10B981,#059669)',
  'linear-gradient(135deg,#F59E0B,#D97706)','linear-gradient(135deg,#EF4444,#DC2626)','linear-gradient(135deg,#06B6D4,#0891B2)'
];
function avatarHtml(ch, size){ const c = AV_COLORS[(ch.charCodeAt(0) || 0) % AV_COLORS.length]; return '<div class="user-avatar" style="background:' + c + ';' + (size ? 'width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size*0.4) + 'px;' : '') + '">' + esc(ch) + '</div>'; }

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(n){ return '¥' + Number(n || 0).toLocaleString(); }
function relTime(ts){ const diff = Date.now() - ts; if (diff < 60e3) return '刚刚'; if (diff < 3600e3) return Math.floor(diff / 60e3) + ' 分钟前'; if (diff < 86400e3) return Math.floor(diff / 3600e3) + ' 小时前'; return Math.floor(diff / 86400e3) + ' 天前'; }

const EV_MAP = {
  'page_view':'页面浏览','item_view':'浏览商品','item_click':'点击商品','add_to_cart':'加购','collect':'收藏','share':'分享',
  'submit_order':'提交订单','pay_success':'支付成功','stay_duration':'停留','search':'搜索','user_login':'登录','form_submit':'提交表单',
  'click_element':'点击元素','click_nav':'点击导航','tab_switch':'切换Tab','click_button':'点击按钮','btn_click_tryon':'AI试穿',
  'click_buy':'点击购买','click_vip_plan':'点击会员方案','btn_click_customize':'开始定制','btn_click_look':'查看穿搭','btn_click_note':'写笔记',
  'customize_collect_look':'定制收藏','customize_consult_open':'打开咨询','customize_consult_close':'关闭咨询','customize_page_view':'定制页浏览','customize_page_leave':'离开定制页',
  'error_event':'异常事件','btn_click_upload':'上传照片','tryon_complete':'试穿完成','outfit_generate':'生成穿搭'
};
function evLabel(e){ return EV_MAP[e] || e; }
function evDot(e){
  const s = String(e);
  if (/(pay|order|buy|collect|favorite|share|cart|vip|consult)/i.test(s)) return 'green';
  if (/tryon|customize|outfit|note/i.test(s)) return 'purple';
  if (/search/i.test(s)) return 'orange';
  if (/page_view|pageview/i.test(s)) return 'blue';
  return 'orange';
}
const EV_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>';

async function init() {
  const key = new URLSearchParams(location.search).get('key');
  if (!key) { document.getElementById('content').style.visibility = 'visible'; document.getElementById('headerBox').innerHTML = '<div class="empty">缺少 key 参数，请从用户列表进入</div>'; return; }
  try {
    const [uj, hot] = await Promise.all([
      fetch('/api/intent/user?key=' + encodeURIComponent(key)).then(r => r.json()),
      fetch('/api/intent/users?tab=hot&size=1').then(r => r.json()).catch(() => null)
    ]);
    if (uj.code !== 0) throw new Error(uj.msg || '用户不存在');
    U = uj.data;
    if (hot && hot.data) document.getElementById('navHotCnt').textContent = hot.data.summary && hot.data.summary.hotUsers != null ? hot.data.summary.hotUsers : hot.data.total;
    render();
  } catch (e) {
    document.getElementById('content').style.visibility = 'visible';
    document.getElementById('headerBox').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}

function prioBadge(p){
  if (p >= 60) return '<span class="badge badge-danger">紧急</span>';
  if (p >= 30) return '<span class="badge badge-warning">重要</span>';
  return '<span class="badge badge-success">一般</span>';
}

function render() {
  const u = U;
  document.getElementById('pageTitle').textContent = u.displayName + ' · 用户工作台';
  document.title = u.displayName + ' — airU 销售工作台';
  document.getElementById('bcName').textContent = u.displayName + ' 详情';

  // 头部
  document.getElementById('headerBox').innerHTML = `
    ${avatarHtml((u.displayName || '?')[0], 56)}
    <div class="user-info-main">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;">
        <span style="font-size:22px;font-weight:700;letter-spacing:-0.02em;">${esc(u.displayName)}</span>
        ${u.isHeatingUp ? '<span class="badge badge-danger">⚡ 升温中</span>' : ''}
        ${u.crosssellScore > 0 ? '<span class="badge badge-purple">🛍 连带机会</span>' : ''}
      </div>
      <div style="font-size:12px;color:var(--fg-3);margin-bottom:10px;font-family:monospace;">
        AID：${esc(u.aid || '—')}${u.uid ? ' · UID：' + esc(u.uid) : ''} · 连续活跃 ${u.openDays || 0} 天
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        <span class="badge badge-blue">行为 ${u.behaviorCount || 0} 次</span>
        <span class="badge badge-success">收藏穿搭 ${u.collectedLooks || 0}</span>
        <span class="badge badge-warning">浏览商品 ${u.viewedSkus || 0}</span>
        <span class="badge badge-muted">最近活跃 ${u.lastActive ? relTime(u.lastActive) : '—'}</span>
      </div>
    </div>
    <div class="user-info-stats">
      <div class="info-stat"><div class="info-stat-label">意向评分</div><div class="info-stat-value">${u.score != null ? Math.round(u.score) : '—'}</div></div>
      <div class="info-stat"><div class="info-stat-label">优先级</div><div class="info-stat-value normal">${prioBadge(u.priority)}</div></div>
      <div class="info-stat"><div class="info-stat-label">加速指数</div><div class="info-stat-value normal">×${u.momentum != null ? u.momentum : '—'}</div></div>
      <div class="info-stat"><div class="info-stat-label">今日意向</div><div class="info-stat-value">${u.todayScore != null ? Math.round(u.todayScore) : '—'}</div></div>
    </div>`;

  // 时间线
  const tl = u.timeline || [];
  document.getElementById('tlCnt').textContent = '最近 ' + Math.min(tl.length, 40) + ' 条';
  document.getElementById('timelineBox').innerHTML = tl.length
    ? tl.slice(0, 40).map(t => `
      <div class="timeline-item">
        <div class="timeline-dot ${evDot(t.event)}">${EV_ICON}</div>
        <div class="timeline-content">
          <div class="timeline-title">${esc(evLabel(t.event))}${t.eventMsg ? ' · <span style="font-weight:400;color:var(--fg-2);">' + esc(t.eventMsg) + '</span>' : ''}</div>
          <div class="timeline-desc url-cell" style="max-width:none;">${esc(t.url || '')}</div>
          <div class="timeline-time">${esc(t.formattedTime || '')}</div>
        </div>
      </div>`).join('')
    : '<div class="empty">暂无行为记录</div>';

  // 评分构成
  const details = (u.scoreDetails || []).slice(0, 12).sort((a, b) => Math.abs(b.point || 0) - Math.abs(a.point || 0));
  const maxAbs = Math.max(1, ...details.map(d => Math.abs(d.point || 0)));
  document.getElementById('scoreBox').innerHTML = details.length
    ? details.map(d => `
      <div class="score-bar-row">
        <span class="score-bar-label">${esc(d.label || d.event)}</span>
        <div class="score-bar-bg"><div class="score-bar-fill" style="width:${Math.max(2, (Math.abs(d.point || 0) / maxAbs) * 100)}%;${d.point < 0 ? 'background:linear-gradient(135deg,#F87171,#EF4444);' : ''}"></div></div>
        <span class="score-bar-val" style="color:${d.point >= 0 ? 'var(--blue)' : 'var(--danger)'};">${d.point >= 0 ? '+' : ''}${Math.round(d.point * 10) / 10}</span>
      </div>`).join('')
    : '<div class="empty">暂无评分明细</div>';

  // 推荐动作
  const scripts = [];
  if (u.isHeatingUp) scripts.push({ label: '快速升温', text: u.displayName + ' 行为热度上升，建议今日内主动联系，优先推荐当季热门款。' });
  if (u.collectedLooks > 0) scripts.push({ label: '收藏穿搭跟进', text: '收藏了 ' + u.collectedLooks + ' 套穿搭，询问是否想试穿同款，引导到店/AI 试穿。' });
  if (u.crosssellScore > 0 && (u.crosssellReasons || []).length) scripts.push({ label: '连带机会', text: '潜在连带需求（' + (u.crosssellReasons || []).join('、') + '），顺势做整套搭配推荐。' });
  if (u.viewedSkus > 0) scripts.push({ label: '浏览商品', text: '浏览了 ' + u.viewedSkus + ' 件商品，询问偏好尺码与风格，精准推荐。' });
  if (u.openDays >= 3) scripts.push({ label: '老客维护', text: '连续 ' + u.openDays + ' 天打开的老客，发轻量问候 + 新品预告维持到店频率。' });
  scripts.push({ label: '标准开场', text: u.displayName + ' 您好，我是 airU 形象顾问～最近有什么场合需要帮忙搭配吗？' });
  document.getElementById('scriptBox').innerHTML = scripts.slice(0, 4).map(s => '<div class="script-card"><span class="si-label">' + s.label + '</span>' + esc(s.text) + '</div>').join('');

  // 连带机会
  if (u.crosssellScore > 0) {
    document.getElementById('crossBadge').textContent = '连带 ' + u.crosssellScore + ' 分';
    document.getElementById('crossBody').innerHTML = `
      <div class="flex justify-between items-center" style="margin-bottom:12px;">
        <span class="fs-13 text-muted">建议连带金额</span>
        <span class="text-success fw-700" style="font-size:22px;">${fmtMoney(u.crosssellAmount)}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">${(u.crosssellReasons || []).map(r => '<span class="badge badge-blue">' + esc(r) + '</span>').join('')}</div>`;
  } else {
    document.getElementById('crossBadge').textContent = '暂无';
    document.getElementById('crossBody').innerHTML = '<div class="empty">暂无连带销售机会</div>';
  }

  renderFu();
  document.getElementById('content').style.visibility = 'visible';
}

function renderFu() {
  const fus = U.followUps || [];
  const stMap = { pending: ['var(--blue)', '待跟进'], done: ['var(--success)', '已跟进'], canceled: ['var(--fg-3)', '已取消'] };
  document.getElementById('fuBox').innerHTML = fus.length
    ? fus.map(f => {
        const [c, lb] = stMap[f.status] || ['var(--fg-3)', f.status];
        return `<div class="follow-record">
          <div class="follow-record-dot ${f.status === 'done' ? 'green' : f.status === 'canceled' ? 'gray' : ''}" style="background:${c};"></div>
          <div style="flex:1;">
            <div class="flex justify-between items-center" style="gap:8px;">
              <span class="follow-record-title">${lb} · ${esc(f.plan_time || '未设定时间')}</span>
              ${f.status === 'pending' ? '<div style="display:flex;gap:6px;"><button class="btn btn-primary btn-xs" data-fuact="done" data-id="' + f.id + '">完成</button><button class="btn btn-secondary btn-xs" data-fuact="canceled" data-id="' + f.id + '">取消</button></div>' : ''}
            </div>
            ${f.note ? '<div class="follow-record-desc">' + esc(f.note) + '</div>' : ''}
            <div class="follow-record-meta">负责人 ${esc(f.owner || '—')} · ${esc(new Date(f.created_at).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }))}</div>
          </div>
        </div>`;
      }).join('')
    : '<div class="empty">暂无跟进记录</div>';

  document.querySelectorAll('[data-fuact]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id, act = btn.dataset.fuact;
      const st = { done: '完成', canceled: '取消' }[act];
      if (!confirm('确认要' + st + '这条预约吗？')) return;
      try {
        const j = await fetch('/api/follow-ups/' + id + '/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: act }) }).then(r => r.json());
        if (j.code !== 0) throw new Error(j.msg);
        const ud = await fetch('/api/intent/user?key=' + encodeURIComponent(U.key)).then(r => r.json());
        U.followUps = (ud.data && ud.data.followUps) || [];
        renderFu();
      } catch (e) { alert('操作失败：' + e.message); }
    });
  });
}

function openFollowModal() {
  if (!U) return;
  document.getElementById('fuUser').value = U.displayName + '（' + U.key + '）';
  document.getElementById('fuOwner').value = '';
  document.getElementById('fuPlanTime').value = '';
  document.getElementById('fuNote').value = '';
  document.getElementById('fuModal').classList.add('open');
}

async function submitFollow() {
  const owner = document.getElementById('fuOwner').value;
  const planTime = document.getElementById('fuPlanTime').value;
  const note = document.getElementById('fuNote').value;
  if (!owner) { alert('请选择跟进人员'); return; }
  if (!planTime) { alert('请选择跟进时间'); return; }
  try {
    const j = await fetch('/api/follow-ups', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_key: U.key, display_name: U.displayName, plan_time: planTime, note, owner }) }).then(r => r.json());
    if (j.code !== 0) throw new Error(j.msg);
    document.getElementById('fuModal').classList.remove('open');
    const ud = await fetch('/api/intent/user?key=' + encodeURIComponent(U.key)).then(r => r.json());
    U.followUps = (ud.data && ud.data.followUps) || [];
    renderFu();
  } catch (e) { alert('提交失败：' + e.message); }
}

document.getElementById('fuModal').addEventListener('click', e => { if (e.target.id === 'fuModal') e.currentTarget.classList.remove('open'); });
init();
</script>
</body>
</html>
