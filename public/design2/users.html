<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高意向用户 — airU 销售工作台</title>
<link rel="stylesheet" href="./shared.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <a class="sidebar-logo" href="./dashboard.html">
      <img src="https://xla-persist.xingliu.art/wm/artifacts/agent/sUAa5B7d5JFovIE8.png" alt="airU logo" onerror="this.outerHTML='<span style=&quot;width:32px;height:32px;border-radius:8px;background:var(--data-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;&quot;>U</span>'">
      <span class="sidebar-logo-text">airU 销售工作台</span>
    </a>
    <nav class="sidebar-nav">
      <div class="nav-section">工作台</div>
      <a href="./dashboard.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        今日概览
      </a>
      <a href="./users.html" class="nav-item active">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        高意向用户
        <span class="nav-badge" id="navHotCnt">-</span>
      </a>
      <a href="./behavior.html" class="nav-item m-nav-hide">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        行为日志
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar">张</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">张店长</div>
          <div class="sidebar-user-role">门店管理员</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <h1 class="topbar-title">高意向用户</h1>
      <div class="topbar-search">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="kwTop" type="text" placeholder="搜索用户名 / AID / UID" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <div class="topbar-icon-btn" title="通知">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notif-dot"></span>
      </div>
      <div class="topbar-avatar" title="张店长">张</div>
    </header>

    <main class="content">

      <!-- Page header -->
      <div class="flex justify-between items-center mb-5" style="flex-wrap:wrap;gap:10px;">
        <div>
          <h2 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;">高意向用户</h2>
          <p class="page-head-sub" id="headSub">基于近 48 小时行为与意图模型实时评分</p>
        </div>
        <div class="flex gap-2" style="flex-wrap:wrap;">
          <div class="search-bar">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="kwInput" type="text" placeholder="搜索用户名、AID..." onkeydown="if(event.key==='Enter')doSearch()">
          </div>
          <select class="form-select" id="prioSel" style="width:auto;" onchange="load(1)">
            <option value="">全部优先级</option>
            <option value="high">紧急</option>
            <option value="mid">重要</option>
            <option value="low">一般</option>
          </select>
          <button class="btn btn-primary btn-sm" onclick="batchOpen()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            批量跟进
          </button>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs-line">
        <a class="tab-item" data-tab="hot" href="javascript:void(0)">今日重点 <span class="tab-count" id="cntHot">-</span></a>
        <a class="tab-item" data-tab="followup" href="javascript:void(0)">待跟进 <span class="tab-count" id="cntFollow">-</span></a>
        <a class="tab-item" data-tab="crosssell" href="javascript:void(0)">连带机会 <span class="tab-count" id="cntCross">-</span></a>
        <a class="tab-item" data-tab="all" href="javascript:void(0)">全部会员 <span class="tab-count" id="cntAll">-</span></a>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:34px;"><input type="checkbox" id="chkAll" style="accent-color:var(--blue);" onclick="toggleAll(this)"></th>
                <th>用户</th>
                <th class="right m-col-hide">意向分</th>
                <th class="right m-col-hide">加速×</th>
                <th class="m-col-hide">优先级</th>
                <th>今日信号</th>
                <th class="right m-col-hide">连带机会</th>
                <th class="right m-col-hide">行为数</th>
                <th class="m-col-hide">跟进状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tbody"><tr><td colspan="10" class="loading">加载中…</td></tr></tbody>
          </table>
        </div>
        <div class="pagination">
          <span class="page-info" id="pageInfo">-</span>
          <div class="page-btns" id="pageBtns"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- 预约跟进 Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">预约跟进 — <span id="modalName"></span></div>
      <button class="modal-close" onclick="closeModal()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">跟进对象</label>
        <input class="form-input" id="fuUser" readonly>
      </div>
      <div class="form-group">
        <label class="form-label">跟进人员</label>
        <select class="form-select" id="fuOwner">
          <option value="">请选择</option>
          <option>小林</option>
          <option>小付</option>
          <option>小陈</option>
          <option>小葛</option>
          <option>林老师</option>
          <option>赵老师</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">跟进时间</label>
        <select class="form-select" id="fuPlanTime">
          <option value="">请选择</option>
          <option>今天下午</option>
          <option>明天上午</option>
          <option>明天下午</option>
          <option>后天</option>
          <option>本周内</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">备注</label>
        <textarea class="form-textarea" id="fuNote" placeholder="请输入跟进备注..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="fuSubmit" onclick="submitFollow()">确认预约</button>
    </div>
  </div>
</div>

<script>
const PAGE = 20;
let curTab = 'hot', curPage = 1, allRows = [];
let fuKeys = [], fuNames = [], fuBatch = false;
let selectedKeys = new Set();

const AV_COLORS = [
  'linear-gradient(135deg,#2563EB,#3B82F6)','linear-gradient(135deg,#8B5CF6,#7C3AED)','linear-gradient(135deg,#10B981,#059669)',
  'linear-gradient(135deg,#F59E0B,#D97706)','linear-gradient(135deg,#EF4444,#DC2626)','linear-gradient(135deg,#06B6D4,#0891B2)',
  'linear-gradient(135deg,#94A3B8,#64748B)','linear-gradient(135deg,#EC4899,#DB2777)'
];
function avatarHtml(ch, size){ const c = AV_COLORS[(ch.charCodeAt(0) || 0) % AV_COLORS.length]; return '<div class="user-avatar" style="background:' + c + ';' + (size ? 'width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size*0.4) + 'px;' : '') + '">' + esc(ch) + '</div>'; }

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(n){ return '¥' + Number(n || 0).toLocaleString(); }

const EV_MAP = {
  'page_view':'页面浏览','item_view':'浏览商品','item_click':'点击商品','add_to_cart':'加购','collect':'收藏','share':'分享',
  'submit_order':'提交订单','pay_success':'支付成功','stay_duration':'停留','search':'搜索','user_login':'登录','form_submit':'提交表单',
  'click_element':'点击元素','click_nav':'点击导航','tab_switch':'切换Tab','click_button':'点击按钮','btn_click_tryon':'AI试穿'
};
function evLabel(e){ return EV_MAP[e] || e; }

function sigHtml(u){
  const arr = [];
  const sig = u.signals;
  if (Array.isArray(sig) && sig.length) { sig.forEach(s => { if (typeof s === 'string') arr.push('<span class="sig-badge">' + esc(s) + '</span>'); }); return arr.join('') || '<span class="text-weak fs-12">—</span>'; }
  if (u.isHeatingUp) arr.push('<span class="sig-badge hot">⚡ 升温中</span>');
  if (u.collectedLooks > 0) arr.push('<span class="sig-badge gold">收藏 ' + u.collectedLooks + '</span>');
  if (u.viewedSkus > 0) arr.push('<span class="sig-badge ok">浏览商品</span>');
  if (u.crosssellScore > 0) arr.push('<span class="sig-badge purple">连带</span>');
  if (Array.isArray(u.recentEvents) && u.recentEvents.length) u.recentEvents.slice(0,2).forEach(e => arr.push('<span class="sig-badge">' + esc(evLabel(typeof e === 'string' ? e : e.event)) + '</span>'));
  if (!arr.length) arr.push('<span class="sig-badge">暂无信号</span>');
  return arr.join('');
}
function prioBadge(p){
  if (p >= 60) return '<span class="badge badge-danger">紧急</span>';
  if (p >= 30) return '<span class="badge badge-warning">重要</span>';
  return '<span class="badge badge-success">一般</span>';
}
function prioLevel(p){ return p >= 60 ? 'high' : p >= 30 ? 'mid' : 'low'; }
function fuBadge(u){
  const f = u.followUp;
  if (!f) return '<span class="badge badge-muted">未预约</span>';
  const cfg = { pending:['var(--danger)','var(--danger)','待跟进'], done:['var(--success)','var(--success)','已联系'], canceled:['var(--fg-3)','var(--fg-3)','已取消'] }[f.status];
  if (!cfg) return '<span class="badge badge-muted">' + esc(f.status) + '</span>';
  const name = f.owner ? ' · ' + f.owner : '';
  return '<span class="follow-status" title="' + esc(f.plan_time || '') + '"><span class="dot" style="background:' + cfg[0] + ';"></span><span style="color:' + cfg[1] + ';">' + cfg[2] + '</span></span>' + '<span class="text-weak fs-12">' + esc(name) + '</span>';
}

function doSearch(){ curPage = 1; syncKw(); load(1); }
function syncKw(){ const t = document.getElementById('kwTop'), i = document.getElementById('kwInput'); if (t.value !== i.value) { t.value = i.value; } }
function getKw(){ return document.getElementById('kwInput').value.trim(); }

function prioFilter(u){ const pv = document.getElementById('prioSel').value; if (!pv) return true; return prioLevel(u.priority || 0) === pv; }

async function load(page, keepTab) {
  if (page) curPage = page;
  const kw = getKw();
  const q = new URLSearchParams({ tab: curTab, page: curPage, size: PAGE });
  if (kw) q.set('keyword', kw);
  const tb = document.getElementById('tbody');
  tb.innerHTML = '<tr><td colspan="10"><div class="loading"><span class="spinner"></span>加载中…</div></td></tr>';
  try {
    const res = await fetch('/api/intent/users?' + q).then(r => r.json());
    const d = res.data || { list: [], total: 0 };
    let list = d.list || [], total = d.total || 0;
    const summary = d.summary || {};

    // 优先级筛选（客户端：翻页在本地执行）
    if (document.getElementById('prioSel').value) {
      let all = [];
      if (!allRows.length) {
        const big = new URLSearchParams({ tab: curTab, size: 1000 });
        if (kw) big.set('keyword', kw);
        const j2 = await fetch('/api/intent/users?' + big).then(r => r.json());
        allRows = (j2.data && j2.data.list) || [];
      }
      const fl = allRows.filter(prioFilter);
      total = fl.length;
      const pages = Math.max(1, Math.ceil(total / PAGE));
      if (curPage > pages) curPage = pages;
      list = fl.slice((curPage - 1) * PAGE, curPage * PAGE);
    }

    const pages = Math.max(1, Math.ceil(total / PAGE));
    if (!list.length) { tb.innerHTML = '<tr><td colspan="10" class="empty">没有符合条件的用户</td></tr>'; }
    else {
      tb.innerHTML = list.map(u => {
        const sel = selectedKeys.has(u.key);
        return `<tr class="row-click" onclick="goDetail('${encodeURIComponent(u.key)}')">
          <td onclick="event.stopPropagation();"><input type="checkbox" style="accent-color:var(--blue);" ${sel ? 'checked' : ''} onchange="rowChk('${encodeURIComponent(u.key)}','${esc(u.displayName)}',this)"></td>
          <td><div class="flex items-center gap-2" style="gap:10px;">${avatarHtml((u.displayName || '?')[0])}<div><div style="font-weight:500;display:flex;align-items:center;gap:6px;">${esc(u.displayName)}${u.isHeatingUp ? '<span class="vip">🔥</span>' : ''}</div><div class="u-meta">${esc(u.aid || '—')}</div></div></div></td>
          <td class="right m-col-hide"><span class="score-num">${u.score != null ? Math.round(u.score) : '—'}</span></td>
          <td class="right m-col-hide"><span class="accel ${u.momentum != null && u.momentum < 1 ? 'flat' : ''}">×${u.momentum != null ? u.momentum : '—'}</span></td>
          <td class="m-col-hide">${prioBadge(u.priority)}</td>
          <td>${sigHtml(u)}</td>
          <td class="right m-col-hide">${u.crosssellScore > 0 ? '<span class="text-success fw-600">' + fmtMoney(u.crosssellAmount) + '</span>' : '<span class="text-weak">—</span>'}</td>
          <td class="right m-col-hide" style="color:var(--fg-2);">${u.behaviorCount || 0}</td>
          <td class="m-col-hide">${fuBadge(u)}</td>
          <td><div class="flex gap-2" style="gap:6px;">
            <a class="btn btn-primary btn-xs" href="javascript:;" onclick="event.stopPropagation();goDetail('${encodeURIComponent(u.key)}')">详情</a>
            <button class="btn btn-secondary btn-xs" onclick="event.stopPropagation();openFollowModal('${encodeURIComponent(u.key)}','${esc(u.displayName)}')">跟进</button>
          </div></td>
        </tr>`;
      }).join('');
      const checked = list.filter(u => selectedKeys.has(u.key)).length;
      document.getElementById('chkAll').checked = list.length > 0 && checked === list.length;
    }

    document.getElementById('pageInfo').textContent = '共 ' + total + ' 位用户 · 第 ' + curPage + '/' + pages + ' 页';
    let btns = '<button class="page-btn" onclick="load(' + (curPage-1) + ')" ' + (curPage<=1?'disabled':'') + '>‹</button>';
    for (let i = 1; i <= pages; i++) {
      if (pages > 9 && i > 1 && i < pages && Math.abs(i-curPage) > 2) continue;
      btns += '<button class="page-btn ' + (i===curPage?'active':'') + '" onclick="load(' + i + ')">' + i + '</button>';
    }
    btns += '<button class="page-btn" onclick="load(' + (curPage+1) + ')" ' + (curPage>=pages?'disabled':'') + '>›</button>';
    document.getElementById('pageBtns').innerHTML = btns;
    document.getElementById('headSub').textContent = summary.hotUsers != null ? ('共 ' + summary.allUsers + ' 位会员，' + summary.hotUsers + ' 位今日重点跟进') : '基于近 48 小时行为与意图模型实时评分';
    if (summary.hotUsers != null) document.getElementById('navHotCnt').textContent = summary.hotUsers;
  } catch (e) {
    tb.innerHTML = '<tr><td colspan="10" class="empty">加载失败：' + esc(e.message) + '</td></tr>';
  }
}

async function loadCounts() {
  try {
    const [hot, fu, cr, all] = await Promise.all([
      fetch('/api/intent/users?tab=hot&size=1').then(r => r.json()),
      fetch('/api/follow-ups?status=pending').then(r => r.json()),
      fetch('/api/intent/users?tab=crosssell&size=1').then(r => r.json()),
      fetch('/api/intent/users?tab=all&size=1').then(r => r.json()),
    ]);
    document.getElementById('cntHot').textContent = hot.data ? hot.data.total : '-';
    document.getElementById('cntFollow').textContent = Array.isArray(fu.data) ? fu.data.length : '-';
    document.getElementById('cntCross').textContent = cr.data ? cr.data.total : '-';
    document.getElementById('cntAll').textContent = all.data ? all.data.total : '-';
    document.getElementById('navHotCnt').textContent = hot.data ? (hot.data.summary && hot.data.summary.hotUsers != null ? hot.data.summary.hotUsers : hot.data.total) : '-';
  } catch (e) {}
}

document.querySelectorAll('.tab-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.tab-item').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    curTab = el.dataset.tab; curPage = 1; allRows = [];
    load(1, true);
  });
});

function goDetail(key){ location.href = './user-detail.html?key=' + encodeURIComponent(key); }

/* 勾选（批量跟进） */
function rowChk(key, name, cb){ const k = decodeURIComponent(key); if (cb.checked) { selectedKeys.add(k); if (!fuNames.some(n => n.key === k)) fuNames.push({ key: k, name }); } else { selectedKeys.delete(k); fuNames = fuNames.filter(n => n.key !== k); } }
function toggleAll(cb){
  const rows = document.querySelectorAll('#tbody input[type=checkbox]:not(#chkAll)');
  rows.forEach(r => { r.checked = cb.checked; if (r.onchange) r.onchange(); });
}
function batchOpen(){
  if (!selectedKeys.size) { alert('请先在列表勾选需要批量跟进预约的用户'); return; }
  openFollowModal('', '');
  document.getElementById('fuUser').value = '已选 ' + selectedKeys.size + ' 位用户';
  fuBatch = true;
}

/* 预约 modal */
function openFollowModal(key, name) {
  fuBatch = false;
  if (key) {
    fuKeys = [decodeURIComponent(key)]; fuNames = [{ key: fuKeys[0], name }];
    document.getElementById('fuUser').value = name + '（' + fuKeys[0] + '）';
  } else if (!fuBatch && selectedKeys.size) {
    fuKeys = [...selectedKeys];
    document.getElementById('fuUser').value = fuNames.map(n => n.name).join('、') + ' 等 ' + fuKeys.length + ' 位用户';
  }
  if (!fuKeys.length) { closeModal(); alert('请先选择需要跟进预约的用户'); return; }
  document.getElementById('fuOwner').value = '';
  document.getElementById('fuPlanTime').value = '';
  document.getElementById('fuNote').value = '';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }

async function submitFollow() {
  const owner = document.getElementById('fuOwner').value;
  const planTime = document.getElementById('fuPlanTime').value;
  const note = document.getElementById('fuNote').value;
  if (!fuKeys.length) { alert('缺少用户标识'); return; }
  if (!owner) { alert('请选择跟进人员'); return; }
  if (!planTime) { alert('请选择跟进时间'); return; }
  const btn = document.getElementById('fuSubmit'); btn.disabled = true;
  try {
    for (const k of fuKeys) {
      const nm = (fuNames.find(n => n.key === k) || {}).name || k;
      await fetch('/api/follow-ups', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_key: k, display_name: nm, plan_time: planTime, note, owner })
      });
    }
    closeModal(); fuKeys = []; fuNames = []; selectedKeys.clear(); allRows = [];
    load(1); loadCounts();
  } catch (e) { alert('提交失败：' + e.message); }
  finally { btn.disabled = false; }
}

document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* URL 参数 */
(function initFromUrl(){
  const p = new URLSearchParams(location.search);
  const tab = p.get('tab'); if (tab && ['hot','followup','crosssell','all'].includes(tab)) curTab = tab;
  document.querySelectorAll('.tab-item').forEach(el => el.classList.toggle('active', el.dataset.tab === curTab));
  const kw = p.get('kw'); if (kw) { document.getElementById('kwInput').value = kw; document.getElementById('kwTop').value = kw; }
  const fu = p.get('fu');
  if (fu) { const nm = p.get('name') || ''; fuKeys = [decodeURIComponent(fu)]; fuNames = [{ key: fuKeys[0], name: decodeURIComponent(nm) }]; setTimeout(() => openFollowModal('', ''), 200); }
})();

load(1, true);
