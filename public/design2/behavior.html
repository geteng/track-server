<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户行为日志 — airU 销售工作台</title>
<link rel="stylesheet" href="./shared.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .stat-chart-row { display: grid; grid-template-columns: repeat(4, 1fr) 2fr; gap: 20px; margin-bottom: 20px; }
  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: 20px; display: flex; flex-direction: column; }
  .chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .chart-card h3 svg { width: 16px; height: 16px; color: var(--blue); }
  .td-time { font-family: monospace; font-size: 12px; color: var(--fg-2); white-space: nowrap; }
  .td-id { color: var(--fg-3); font-family: monospace; font-size: 12px; }
  .td-ua, .td-url { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--fg-3); }
  @media (max-width: 900px) {
    .stat-chart-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <a class="sidebar-logo" href="./dashboard.html">
      <img src="https://xla-persist.xingliu.art/wm/artifacts/agent/sUAa5B7d5JFovIE8.png" alt="airU logo" onerror="this.outerHTML='<span style=&quot;width:32px;height:32px;border-radius:8px;background:var(--data-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;&quot;>U</span>'">
      <span class="sidebar-logo-text">airU 销售工作台</span>
    </a>
    <nav class="sidebar-nav">
      <div class="nav-section">工作台</div>
      <a href="./dashboard.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        今日概览
      </a>
      <a href="./users.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        高意向用户
        <span class="nav-badge" id="navHotCnt">-</span>
      </a>
      <a href="./behavior.html" class="nav-item active m-nav-hide">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        行为日志
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar">张</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">张店长</div>
          <div class="sidebar-user-role">门店管理员</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <h1 class="topbar-title">用户行为日志</h1>
      <div class="topbar-search">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="kwTop" placeholder="AID / UID / 页面URL..." onkeydown="if(event.key==='Enter'){document.getElementById('kwInput').value=this.value;load(1);}">
      </div>
      <div class="topbar-icon-btn" title="通知">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notif-dot"></span>
      </div>
      <div class="topbar-avatar" title="张店长">张</div>
    </header>

    <main class="content">

      <!-- Page header -->
      <div class="flex justify-between items-center mb-5" style="flex-wrap:wrap;gap:10px;">
        <div>
          <h2 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;">用户行为日志</h2>
          <p class="page-head-sub">实时追踪用户行为，洞察购买意向</p>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <div class="filter-group">
          <div class="filter-label">开始时间</div>
          <input type="datetime-local" class="form-input" id="startTime" style="width:170px;">
        </div>
        <div class="filter-group">
          <div class="filter-label">结束时间</div>
          <input type="datetime-local" class="form-input" id="endTime" style="width:170px;">
        </div>
        <div class="filter-group">
          <div class="filter-label">快捷选择</div>
          <div style="display:flex;gap:4px;">
            <button class="quick-btn" data-h="1">近1小时</button>
            <button class="quick-btn" data-h="24">近24小时</button>
            <button class="quick-btn" data-h="168">近7天</button>
            <button class="quick-btn active" data-h="">全部</button>
          </div>
        </div>
        <div class="filter-group">
          <div class="filter-label">事件类型</div>
          <select class="form-select" id="evSelect" style="width:150px;"><option value="">全部事件</option></select>
        </div>
        <div class="filter-group" style="flex:1;min-width:170px;">
          <div class="filter-label">关键词（AID / UID / URL）</div>
          <div class="search-bar" style="width:100%;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="kwInput" placeholder="AID / UID / 页面URL..." style="width:100%;">
          </div>
        </div>
        <div class="filter-group">
          <div class="filter-label">&nbsp;</div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" onclick="resetFilter()">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              重置
            </button>
            <button class="btn btn-primary btn-sm" onclick="load(1)">查询</button>
            <button class="btn btn-secondary btn-sm" onclick="exportCSV()">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              导出 CSV
            </button>
          </div>
        </div>
      </div>

      <!-- Stats + Trend -->
      <div class="stat-chart-row">
        <div class="stat-card">
          <div class="stat-icon blue"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
          <div class="stat-value" id="stTotal">—</div>
          <div class="stat-label">总日志条数</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
          <div class="stat-value" id="stUv">—</div>
          <div class="stat-label">独立访客 UV</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon orange"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></div>
          <div class="stat-value" id="stPv">—</div>
          <div class="stat-label">页面浏览量 PV</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon purple"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
          <div class="stat-value" style="font-size:20px;line-height:1.3;" id="stTopEv">—</div>
          <div class="stat-label" id="stTopEvLb">TOP 事件</div>
        </div>
        <div class="chart-card">
          <h3><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg> 事件趋势 <span class="badge badge-blue" id="chartRange">近24小时</span></h3>
          <div class="chart-bar-wrap" id="trendWrap" style="flex:1;"></div>
          <div style="display:flex;justify-content:space-between;margin-top:6px;"><span class="fs-12 text-weak">最早</span><span class="fs-12 text-weak">最新</span></div>
        </div>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th><th>时间</th><th>AID</th><th>UID</th><th>事件</th>
                <th>事件详情</th><th class="m-col-hide">页面URL</th><th class="m-col-hide">UA</th>
                <th style="text-align:right;">操作</th>
              </tr>
            </thead>
            <tbody id="tbody"><tr><td colspan="9" class="loading">加载中…</td></tr></tbody>
          </table>
        </div>
        <div class="pagination">
          <span class="page-info" id="pageInfo">-</span>
          <div class="page-btns" id="pageBtns"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- 详情 Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal" style="width:600px;">
    <div class="modal-header">
      <div class="modal-title">日志详情</div>
      <button class="modal-close" onclick="document.getElementById('detailModal').classList.remove('open')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="detailBody" style="font-size:13px;">-</div>
  </div>
</div>

<script>
const PAGE = 20;
let curPage = 1;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDT(ts){ const d = new Date(ts); const p = x => String(x).padStart(2,'0'); return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
function fmtHM(ts){ const d = new Date(ts); const p = x => String(x).padStart(2,'0'); return p(d.getHours()) + ':' + p(d.getMinutes()); }

const EV_MAP = {
  'page_view':'页面浏览','item_view':'浏览商品','item_click':'点击商品','add_to_cart':'加购','collect':'收藏','share':'分享',
  'submit_order':'提交订单','pay_success':'支付成功','stay_duration':'停留','search':'搜索','user_login':'登录','form_submit':'提交表单',
  'click_element':'点击元素','click_nav':'点击导航','tab_switch':'切换Tab','click_button':'点击按钮','btn_click_tryon':'AI试穿',
  'click_buy':'点击购买','click_vip_plan':'点击会员方案','btn_click_customize':'开始定制','btn_click_look':'查看穿搭','btn_click_note':'写笔记',
  'customize_collect_look':'定制收藏','customize_consult_open':'打开咨询','customize_consult_close':'关闭咨询','customize_page_view':'定制页浏览','customize_page_leave':'离开定制页',
  'error_event':'异常事件','btn_click_upload':'上传照片','tryon_complete':'试穿完成','outfit_generate':'生成穿搭'
};
function evLabel(e){ return EV_MAP[e] || e; }
function evClass(e){
  const s = String(e);
  if (/(pay|order|buy|collect|favorite|share|cart|vip|consult)/i.test(s)) return 'event-good';
  if (/tryon|customize|outfit|note/i.test(s)) return 'event-ai_try_on';
  if (/page_view|pageview/i.test(s)) return 'event-page_view';
  if (/search/i.test(s)) return 'event-search';
  if (/click|nav|tab|button|element/i.test(s)) return 'event-scene_switch';
  if (/leave|close|error/i.test(s)) return 'event-muted';
  return 'event-muted';
}

setInterval(() => {
  const d = new Date(); const p = x => String(x).padStart(2,'0');
  const el = document.getElementById('nowText2'); if (el) el.textContent = d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}, 1000);

async function loadEvents() {
  try {
    const j = await fetch('/api/behavior-log/events').then(r => r.json());
    const evs = Array.isArray(j.data) ? j.data : [];
    const sel = document.getElementById('evSelect');
    sel.innerHTML = '<option value="">全部事件</option>' + evs.map(e => '<option value="' + esc(e) + '">' + esc(evLabel(e)) + '（' + esc(e) + '）</option>').join('');
  } catch (e) {}
}

/* 快捷时间 */
document.querySelectorAll('.quick-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.quick-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const h = Number(b.dataset.h);
    const end = new Date(), start = new Date(end.getTime() - h * 3600 * 1000);
    const p2 = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + 'T' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    if (h) { document.getElementById('startTime').value = p2(start); document.getElementById('endTime').value = p2(end); document.getElementById('chartRange').textContent = h >= 24 ? ('近' + (h / 24) + '天') : ('近' + h + '小时'); }
    else { document.getElementById('startTime').value = ''; document.getElementById('endTime').value = ''; document.getElementById('chartRange').textContent = '全部'; }
    load(1);
  });
});

function buildParams(page){
  const p = new URLSearchParams({ page, size: PAGE });
  const st = document.getElementById('startTime').value, et = document.getElementById('endTime').value;
  if (st) p.set('startTime', new Date(st).getTime());
  if (et) p.set('endTime', new Date(et).getTime());
  const ev = document.getElementById('evSelect').value; if (ev) p.set('event', ev);
  const kw = document.getElementById('kwInput').value.trim();
  if (kw) {
    if (/^[0-9a-f]{8,}$/i.test(kw)) p.set('aid', kw);
    else if (/^\d+$/.test(kw)) p.set('uid', kw);
    else p.set('url', kw);
  }
  return p;
}
function resetFilter(){
  document.querySelectorAll('.quick-btn').forEach(x => x.classList.toggle('active', x.dataset.h === ''));
  document.getElementById('startTime').value = ''; document.getElementById('endTime').value = '';
  document.getElementById('chartRange').textContent = '全部';
  document.getElementById('evSelect').value = '';
  document.getElementById('kwInput').value = ''; document.getElementById('kwTop').value = '';
  load(1);
}

async function load(page){
  if (page) curPage = page;
  const p = buildParams(curPage);
  const tb = document.getElementById('tbody');
  tb.innerHTML = '<tr><td colspan="9"><div class="loading"><span class="spinner"></span>加载中…</div></td></tr>';
  try {
    const j = await fetch('/api/behavior-log/list?' + p).then(r => r.json());
    const d = j.data || { list: [], total: 0 };
    const list = d.list || [], total = d.total || 0, pages = Math.max(1, Math.ceil(total / PAGE));
    const stats = d.stats || {};

    document.getElementById('stTotal').textContent = Number(stats.total || total).toLocaleString();
    document.getElementById('stUv').textContent = stats.uniqueUsers != null ? stats.uniqueUsers : '—';
    document.getElementById('stPv').textContent = stats.pvCount != null ? stats.pvCount.toLocaleString() : '—';
    const top = (stats.topEvents || [])[0];
    document.getElementById('stTopEv').textContent = top ? evLabel(top.event) : '—';
    document.getElementById('stTopEvLb').textContent = top ? ('TOP 事件（' + top.count + ' 次）') : 'TOP 事件';

    const trend = d.trend || [];
    const last48 = trend.slice(-48);
    const maxC = Math.max(1, ...last48.map(t => t.count));
    document.getElementById('trendWrap').innerHTML = last48.length
      ? last48.map(t => { const hgt = Math.max(4, Math.round((t.count / maxC) * 44)); return '<div class="chart-bar" style="height:' + hgt + 'px;" title="' + fmtDT(t.hourBucket) + ' · ' + t.count + ' 次"></div>'; }).join('')
      : '<div class="empty" style="grid-column:1/-1;width:100%;">暂无数据</div>';

    if (!list.length) tb.innerHTML = '<tr><td colspan="9" class="empty">没有符合条件的日志</td></tr>';
    else tb.innerHTML = list.map(r => `
      <tr class="row-click" onclick="showDetail(${r.id})">
        <td class="td-id">#${r.id}</td>
        <td class="td-time">${fmtDT(r.timestamp)}</td>
        <td class="mono">${esc(r.aid || '—')}</td>
        <td class="mono">${esc(r.uid || '—')}</td>
        <td><span class="event-tag ${evClass(r.event)}">${esc(evLabel(r.event))}</span></td>
        <td class="td-url" style="max-width:220px;" title="${esc(r.eventMsg || '')}">${esc(r.eventMsg || '—')}</td>
        <td class="td-url m-col-hide" title="${esc(r.url || '')}">${esc(r.url ? r.url.replace(/^https?:\/\//, '') : '—')}</td>
        <td class="td-ua m-col-hide" title="${esc(r.userAgent || '')}">${esc((r.userAgent || '').slice(0, 60))}</td>
        <td style="text-align:right;"><button class="btn btn-secondary btn-xs" onclick="event.stopPropagation();showDetail(${r.id})">详情</button></td>
      </tr>`).join('');

    document.getElementById('pageInfo').textContent = '共 ' + total.toLocaleString() + ' 条记录';
    let btns = '<button class="page-btn" onclick="load(' + (curPage-1) + ')" ' + (curPage<=1?'disabled':'') + '>‹</button>';
    for (let i = 1; i <= pages; i++) {
      if (pages > 9 && i > 1 && i < pages && Math.abs(i-curPage) > 2) continue;
      btns += '<button class="page-btn ' + (i===curPage?'active':'') + '" onclick="load(' + i + ')">' + i + '</button>';
    }
    btns += '<button class="page-btn" onclick="load(' + (curPage+1) + ')" ' + (curPage>=pages?'disabled':'') + '>›</button>';
    document.getElementById('pageBtns').innerHTML = btns;
  } catch (e) {
    tb.innerHTML = '<tr><td colspan="9" class="empty">加载失败：' + esc(e.message) + '</td></tr>';
  }
}

async function showDetail(id) {
  document.getElementById('detailBody').innerHTML = '<div class="loading"><span class="spinner"></span>加载中…</div>';
  document.getElementById('detailModal').classList.add('open');
  try {
    const j = await fetch('/api/behavior-log/' + id).then(r => r.json());
    if (j.code !== 0) throw new Error(j.msg || '记录不存在');
    const d = j.data || {};
    let extraHtml = '';
    try { const ex = JSON.parse(d.extra || '{}'); extraHtml = Object.entries(ex).map(([k, v]) => '<div><span class="text-blue fw-600">' + esc(k) + '</span>：' + esc(typeof v === 'object' ? JSON.stringify(v) : v) + '</div>').join(''); }
    catch (e) { extraHtml = '<div>' + esc(d.extra || '—') + '</div>'; }
    const ua = d.userAgent || '';
    const device = /iPhone/i.test(ua) ? 'iPhone' : /iPad/i.test(ua) ? 'iPad' : /Android/i.test(ua) ? 'Android' : 'PC';
    const browser = ((ua.match(/(Chrome|Safari|Firefox|Edge|MicroMessenger)\/?[\d.]*/)) || [])[0] || '未知';
    document.getElementById('detailBody').innerHTML = `
      <div class="kv">
        <div><span class="k">记录 ID：</span><span class="v mono">#${d.id}</span></div>
        <div><span class="k">时间：</span><span class="v">${fmtDT(d.timestamp)}</span></div>
        <div><span class="k">AID：</span><span class="v mono">${esc(d.aid || '—')}</span></div>
        <div><span class="k">UID：</span><span class="v mono">${esc(d.uid || '—')}</span></div>
        <div class="divider"></div>
        <div><span class="k">事件：</span><span class="v"><span class="event-tag ${evClass(d.event)}">${esc(evLabel(d.event))}</span> <span class="text-muted fs-12">${esc(d.eventMsg || '')}</span></span></div>
        <div><span class="k">页面 URL：</span><span class="v">${esc(d.url || '—')}</span></div>
        <div><span class="k">来源：</span><span class="v">${esc(d.referrer || '—')}</span></div>
        <div><span class="k">屏幕：</span><span class="v">${esc(d.screen || '—')}</span></div>
        <div class="divider"></div>
        <div><span class="k">设备：</span><span class="v">${device} · ${browser}</span></div>
        ${extraHtml}
      </div>`;
  } catch (e) {
    document.getElementById('detailBody').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}

async function exportCSV() {
  try {
    const p = buildParams(1); p.set('size', 1000); p.set('page', 1);
    const j = await fetch('/api/behavior-log/list?' + p).then(r => r.json());
    const list = (j.data && j.data.list) || [];
    if (!list.length) { alert('没有可导出的数据'); return; }
    const head = 'ID,时间,AID,UID,事件,事件详情,URL,来源,屏幕';
    const rows = list.map(r => [r.id, fmtDT(r.timestamp), r.aid || '', r.uid || '', evLabel(r.event), (r.eventMsg || '').replace(/,/g, '，'), r.url || '', r.referrer || '', r.screen || ''].join(','));
    const blob = new Blob(['\ufeff' + head + '\n' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '行为日志_' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click(); URL.revokeObjectURL(a.href);
  } catch (e) { alert('导出失败：' + e.message); }
}

document.getElementById('detailModal').addEventListener('click', e => { if (e.target.id === 'detailModal') e.currentTarget.classList.remove('open'); });

loadEvents();
load(1);
</script>
