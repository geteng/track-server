<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日概览 — airU 销售工作台</title>
<link rel="stylesheet" href="./shared.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .dash-cols { display: grid; grid-template-columns: 360px 1fr; gap: 20px; margin-bottom: 20px; align-items: start; }
  .go-arrow { margin-left: auto; color: var(--fg-3); font-size: 13px; transition: transform .15s; }
  a.stat-card:hover .go-arrow { color: var(--blue); transform: translateX(2px); }
  .action-card .ac-line1 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .ac-title { font-size: 13px; font-weight: 600; color: var(--fg); }
  .ac-desc { font-size: 12px; color: var(--fg-2); line-height: 1.5; }
  .ac-time { font-size: 11px; color: var(--fg-3); margin-top: 4px; }
</style>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <a class="sidebar-logo" href="./dashboard.html">
      <img src="https://xla-persist.xingliu.art/wm/artifacts/agent/sUAa5B7d5JFovIE8.png" alt="airU logo" onerror="this.outerHTML='<span style=&quot;width:32px;height:32px;border-radius:8px;background:var(--data-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;&quot;>U</span>'">
      <span class="sidebar-logo-text">airU 销售工作台</span>
    </a>
    <nav class="sidebar-nav">
      <div class="nav-section">工作台</div>
      <a href="./dashboard.html" class="nav-item active">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        今日概览
      </a>
      <a href="./users.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        高意向用户
        <span class="nav-badge" id="navHotCnt">-</span>
      </a>
      <a href="./behavior.html" class="nav-item m-nav-hide">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        行为日志
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar">张</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">张店长</div>
          <div class="sidebar-user-role">门店管理员</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <h1 class="topbar-title">今日概览<span class="title-date" id="nowText">-</span></h1>
      <div class="topbar-search">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="搜索用户，回车跳转…" onkeydown="if(event.key==='Enter'){const v=this.value.trim();if(v)location.href='./users.html?kw='+encodeURIComponent(v);}">
      </div>
      <div class="topbar-icon-btn" title="通知">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notif-dot"></span>
      </div>
      <div class="topbar-avatar" title="张店长">张</div>
    </header>

    <main class="content">

      <!-- Page header -->
      <div class="flex justify-between items-center mb-5" style="flex-wrap:wrap;gap:10px;">
        <div>
          <h2 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;">今日概览</h2>
          <p class="page-head-sub">实时高意向识别 · 行动建议 · 连带销售机会</p>
        </div>
        <div class="flex gap-2" style="flex-wrap:wrap;">
          <button class="btn btn-secondary btn-sm" onclick="load()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            刷新数据
          </button>
        </div>
      </div>

      <!-- 6 个统计磁贴（可点击 → 高意向用户列表对应 Tab） -->
      <div class="grid-3 mb-5" id="statsRow">
        <a class="stat-card" href="./users.html?tab=hot">
          <div class="stat-icon blue"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
          <div class="stat-value" id="st1">—</div>
          <div class="stat-label">今日高意向用户</div>
          <div class="stat-foot" id="st1d">最近 48 小时识别</div>
          <span class="go-arrow">查看 →</span>
        </a>
        <a class="stat-card" href="./users.html?tab=followup">
          <div class="stat-icon orange"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
          <div class="stat-value" id="st2">—</div>
          <div class="stat-label">待跟进任务</div>
          <div class="stat-foot" id="st2d">预约未完成</div>
          <span class="go-arrow">查看 →</span>
        </a>
        <a class="stat-card" href="./users.html?tab=crosssell">
          <div class="stat-icon green"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>
          <div class="stat-value" style="font-size:24px;" id="st3">—</div>
          <div class="stat-label">连带销售机会金额</div>
          <div class="stat-foot" id="st3d">近 48 小时潜在连带</div>
          <span class="go-arrow">查看 →</span>
        </a>
        <a class="stat-card" href="./users.html?tab=followup">
          <div class="stat-icon purple"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
          <div class="stat-value" id="st4">—</div>
          <div class="stat-label">今日已联系用户</div>
          <div class="stat-foot">跟进任务完成数</div>
          <span class="go-arrow">查看 →</span>
        </a>
        <a class="stat-card" href="./users.html?tab=all">
          <div class="stat-icon blue"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/></svg></div>
          <div class="stat-value">—</div>
          <div class="stat-label">本周转化率</div>
          <div class="stat-foot">待接入订单数据</div>
          <span class="go-arrow">查看 →</span>
        </a>
        <a class="stat-card" href="./users.html?tab=crosssell">
          <div class="stat-icon green"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
          <div class="stat-value" style="font-size:24px;" id="st6">—</div>
          <div class="stat-label">本月连带销售金额</div>
          <div class="stat-foot">潜在成交口径</div>
          <span class="go-arrow">查看 →</span>
        </a>
      </div>

      <!-- Row: 行动建议 + 今日重点 -->
      <div class="dash-cols">
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              今日行动建议
            </div>
            <span class="badge badge-blue" id="sumCnt">0 条</span>
          </div>
          <div class="card-body" id="summaryList"><div class="loading">加载中…</div></div>
        </div>

        <div class="card m-dash-hide" id="focusCard">
          <div class="card-header">
            <div class="card-title">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              今日重点跟进
            </div>
            <a href="./users.html?tab=hot" class="btn btn-ghost btn-sm">查看全部
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </a>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>用户</th><th class="right">意向分</th><th class="right">加速×</th><th>状态</th><th>操作</th></tr>
              </thead>
              <tbody id="hotBody"><tr><td colspan="5" class="loading">加载中…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 连带销售推荐 -->
      <div class="card m-dash-hide" id="upsellCard">
        <div class="card-header">
          <div class="card-title">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            连带销售推荐
          </div>
          <div class="flex items-center gap-2">
            <span class="fs-13 text-muted">总潜力</span>
            <span class="text-success fw-700" style="font-size:18px;" id="upsellTotal">¥0</span>
          </div>
        </div>
        <div class="card-body">
          <div class="grid-3" id="crossGrid"><div class="loading">加载中…</div></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(n){ return '¥' + Number(n || 0).toLocaleString(); }
setInterval(() => {
  const d = new Date(); const p = x => String(x).padStart(2,'0');
  document.getElementById('nowText').textContent = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 · ' + p(d.getHours()) + ':' + p(d.getMinutes());
}, 1000);

// 头像配色（按姓名首字）
const AV_COLORS = [
  'linear-gradient(135deg,#2563EB,#3B82F6)','linear-gradient(135deg,#8B5CF6,#7C3AED)','linear-gradient(135deg,#10B981,#059669)',
  'linear-gradient(135deg,#F59E0B,#D97706)','linear-gradient(135deg,#EF4444,#DC2626)','linear-gradient(135deg,#06B6D4,#0891B2)'
];
function avatarHtml(ch, s){ const c = AV_COLORS[(ch.charCodeAt(0) || 0) % AV_COLORS.length]; return '<div class="user-avatar" style="background:' + c + ';' + (s ? 'width:' + s + 'px;height:' + s + 'px;font-size:' + Math.round(s*0.4) + 'px;' : '') + '">' + esc(ch) + '</div>'; }

function statusOf(u){
  if (u.isHeatingUp) return '<span class="badge badge-danger">升温中</span>';
  if (u.collectedLooks > 0) return '<span class="badge badge-purple">收藏 ' + u.collectedLooks + '</span>';
  if (u.viewedSkus > 0) return '<span class="badge badge-info">浏览商品</span>';
  return '<span class="badge badge-success">活跃</span>';
}
function sigBadges(u){
  const b = [];
  if (u.isHeatingUp) b.push('<span class="sig-badge hot">⚡ 升温中</span>');
  if (u.collectedLooks > 0) b.push('<span class="sig-badge gold">收藏 ' + u.collectedLooks + '</span>');
  if (u.viewedSkus > 0) b.push('<span class="sig-badge ok">浏览商品 ' + u.viewedSkus + '</span>');
  if (u.crosssellScore > 0) b.push('<span class="sig-badge purple">连带 ' + fmtMoney(u.crosssellAmount) + '</span>');
  if (!b.length) b.push('<span class="sig-badge">近 48h 活跃</span>');
  return b.join('');
}
function prioBadge(p){
  if (p >= 60) return '<span class="badge badge-danger">紧急</span>';
  if (p >= 30) return '<span class="badge badge-warning">重要</span>';
  return '<span class="badge badge-success">一般</span>';
}
function goDetail(key){ location.href = './user-detail.html?key=' + encodeURIComponent(key); }
function openFollow(key, name){ location.href = './users.html?tab=followup&fu=' + encodeURIComponent(key) + '&name=' + encodeURIComponent(name); }

async function load() {
  try {
    const [hotRes, crossRes, sumRes, fuRes] = await Promise.all([
      fetch('/api/intent/users?tab=hot&size=5').then(r => r.json()),
      fetch('/api/intent/users?tab=crosssell&size=3').then(r => r.json()),
      fetch('/api/intent/action-summary').then(r => r.json()),
      fetch('/api/follow-ups?status=all').then(r => r.json()),
    ]);
    const hot = hotRes.data || { list: [], summary: {} };
    const hotList = hot.list || [];
    const summary = hot.summary || {};
    const crossList = (crossRes.data && crossRes.data.list) || [];
    const items = (sumRes.data && sumRes.data.items) || [];
    const fus = (fuRes.data) || [];
    const doneCnt = fus.filter(f => f.status === 'done').length;

    document.getElementById('navHotCnt').textContent = hotRes.data.total;
    const pending = fus.filter(f => f.status === 'pending');
    document.getElementById('st1').textContent = summary.hotUsers != null ? summary.hotUsers : hotList.length;
    document.getElementById('st1d').textContent = hotList[0] ? '最高优先级：' + hotList[0].displayName : '最近 48 小时无高意向';
    document.getElementById('st2').textContent = summary.pendingFollowUps != null ? summary.pendingFollowUps : pending.length;
    document.getElementById('st2d').textContent = pending[0] ? pending[0].display_name + ' · ' + pending[0].plan_time : '暂无待跟进预约';
    document.getElementById('st3').textContent = fmtMoney(summary.crosssellTotal);
    document.getElementById('st3d').textContent = crossList[0] ? '最高：' + crossList[0].displayName + ' ' + fmtMoney(crossList[0].crosssellAmount) : '暂无连带机会';
    document.getElementById('st4').textContent = doneCnt;
    document.getElementById('st6').textContent = fmtMoney(summary.monthCrossSell);
    document.getElementById('upsellTotal').textContent = fmtMoney(summary.crosssellTotal);

    // 行动建议
    document.getElementById('sumCnt').textContent = items.length + ' 条';
    document.getElementById('summaryList').innerHTML = items.length
      ? items.map((it, i) => {
          const href = it.key ? './user-detail.html?key=' + encodeURIComponent(it.key) : './users.html?tab=all';
          const pri = i === 0 ? 'high' : i === 1 ? 'medium' : 'low';
          return '<a class="action-card" href="' + href + '"><div class="action-priority ' + pri + '"></div><div style="flex:1;"><div class="ac-line1"><span class="ac-title">' + esc(it.text) + '</span></div><div class="ac-time">点击查看用户工作台</div></div></a>';
        }).join('')
      : '<div class="empty">今日暂无行动建议</div>';

    // 今日重点
    document.getElementById('hotBody').innerHTML = hotList.length
      ? hotList.map(u => `
        <tr class="row-click" onclick="goDetail('${encodeURIComponent(u.key)}')">
          <td><div class="flex items-center gap-2"><div style="display:flex;align-items:center;gap:10px;">${avatarHtml((u.displayName || '?')[0])}<div><div style="font-weight:500;">${esc(u.displayName)}</div><div class="u-meta">${esc(u.aid || '')}</div></div></div></div></td>
          <td class="right"><span class="score-num">${u.score != null ? Math.round(u.score) : '—'}</span></td>
          <td class="right"><span class="accel">×${u.momentum != null ? u.momentum : '—'}</span></td>
          <td>${statusOf(u)}</td>
          <td><div class="flex gap-2">
            <a class="btn btn-primary btn-xs" href="javascript:;" onclick="event.stopPropagation();goDetail('${encodeURIComponent(u.key)}')">详情</a>
            <button class="btn btn-secondary btn-xs" onclick="event.stopPropagation();openFollow('${encodeURIComponent(u.key)}','${esc(u.displayName)}')">跟进</button>
          </div></td>
        </tr>`).join('')
      : '<tr><td colspan="5" class="empty">「今日重点」暂无用户，最近 48 小时无高意向行为</td></tr>';

    // 连带推荐
    document.getElementById('crossGrid').innerHTML = crossList.length
      ? crossList.map(u => `
        <div class="upsell-card">
          <div class="flex items-center gap-2 mb-4" style="margin-bottom:14px;">
            ${avatarHtml((u.displayName || '?')[0])}
            <div style="flex:1;"><div style="font-weight:600;font-size:14px;">${esc(u.displayName)}</div><div class="u-meta">${esc(u.aid || '')}</div></div>
            <div style="text-align:right;"><div class="text-success fw-700" style="font-size:16px;">${fmtMoney(u.crosssellAmount)}</div><div class="fs-12 text-weak">连带 ${u.crosssellScore} 分</div></div>
          </div>
          <div style="background:var(--bg);border-radius:var(--radius);padding:12px;">
            <div style="font-size:12px;font-weight:500;color:var(--fg-2);margin-bottom:8px;">连带原因</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">${(u.crosssellReasons || ['—']).map(r => '<span class="badge badge-blue">' + esc(r) + '</span>').join('')}</div>
          </div>
          <button class="btn btn-primary btn-sm" style="width:100%;justify-content:center;margin-top:12px;" onclick="goDetail('${encodeURIComponent(u.key)}')">查看工作台</button>
        </div>`).join('')
      : '<div class="empty" style="grid-column:1/-1;">暂无连带销售机会</div>';
  } catch (e) {
    console.error(e);
    document.getElementById('summaryList').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
