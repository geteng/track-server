<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高意向用户列表 | airU 销售工作台</title>
<style>
:root {
  --primary: #4F46E5;
  --primary-dark: #4338CA;
  --primary-light: #EEF2FF;
  --bg: #F3F4F6;
  --card-bg: #FFFFFF;
  --text: #111827;
  --text-muted: #6B7280;
  --border: #E5E7EB;
  --border-dark: #D1D5DB;
  --green: #10B981;
  --green-light: #D1FAE5;
  --amber: #F59E0B;
  --amber-light: #FEF3C7;
  --red: #EF4444;
  --red-light: #FEE2E2;
  --blue: #3B82F6;
  --blue-light: #DBEAFE;
  --purple: #8B5CF6;
  --purple-light: #EDE9FE;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

/* ===== 统一顶部导航 ===== */
.top-nav { background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.top-nav-inner { max-width: 1400px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; height: 56px; gap: 24px; }
.top-nav .logo { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; }
.top-nav .logo .icon { font-size: 20px; }
.nav-links { display: flex; gap: 4px; flex: 1; }
.nav-links a { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--text-muted); text-decoration: none; transition: all 0.2s; }
.nav-links a:hover { background: var(--bg); color: var(--text); }
.nav-links a.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.nav-right { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-muted); }

/* ===== 布局 ===== */
.container { max-width: 1400px; margin: 0 auto; padding: 20px 24px 40px; }
.page-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

/* ===== Tab ===== */
.tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
.tab { padding: 10px 18px; font-size: 14px; font-weight: 500; color: var(--text-muted); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.tab .count { font-size: 11px; background: var(--bg); padding: 1px 7px; border-radius: 10px; color: var(--text-muted); }
.tab.active .count { background: var(--primary-light); color: var(--primary); }

/* ===== 表格 ===== */
.table-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; min-width: 1000px; border-collapse: collapse; }
thead { background: var(--bg); }
th { padding: 12px 16px; text-align: left; font-size: 12px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr { cursor: pointer; transition: background 0.15s; }
tbody tr:hover td { background: var(--primary-light); }

.avatar-sm { width: 30px; height: 30px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; margin-right: 8px; vertical-align: middle; }
.user-cell { display: flex; align-items: center; }
.user-cell .u { display: flex; flex-direction: column; }
.user-cell .u-name { font-weight: 600; font-size: 13px; }
.user-cell .u-id { font-size: 11px; color: var(--text-muted); font-family: monospace; }

.pill { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill-red { background: var(--red-light); color: var(--red); }
.pill-amber { background: var(--amber-light); color: #92400E; }
.pill-green { background: var(--green-light); color: #065F46; }
.pill-blue { background: var(--blue-light); color: #1E40AF; }
.pill-gray { background: var(--bg); color: var(--text-muted); }

.score-cell { display: flex; align-items: center; gap: 8px; }
.score-bar-wrap { width: 80px; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.score-bar { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--primary), var(--pink)); }

.btn { padding: 6px 14px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: var(--card-bg); border: 1px solid var(--border-dark); color: var(--text); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 4px 10px; font-size: 11px; }

/* 跟进任务标签 */
.fu-tag { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; background: var(--amber-light); color: #92400E; white-space: nowrap; }

/* ===== 分页 ===== */
.pagination { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; }
.page-info { font-size: 13px; color: var(--text-muted); }
.page-btns { display: flex; gap: 8px; }

/* 空态 */
.empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: 13px; }
.loading { text-align: center; padding: 40px; color: var(--text-muted); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; margin: 0 auto 12px; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 弹窗 */
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 200; }
.modal-mask.show { display: flex; }
.modal { background: var(--card-bg); border-radius: 14px; padding: 24px; width: 400px; max-width: 92vw; }
.modal h3 { font-size: 16px; margin-bottom: 16px; }
.form-item { margin-bottom: 14px; }
.form-item label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
.form-item input, .form-item select, .form-item textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border-dark); border-radius: 8px; font-size: 13px; outline: none; background: var(--card-bg); color: var(--text); }
.form-item input:focus, .form-item select:focus, .form-item textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

@media (max-width: 768px) {
  /* ===== 移动端导航适配 ===== */
  .top-nav-inner { padding: 0 10px; gap: 8px; height: 52px; }
  .top-nav .logo { font-size: 14px; gap: 4px; white-space: nowrap; }
  .top-nav .logo .icon { font-size: 18px; }
  .nav-links { gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-links a { padding: 6px 8px; font-size: 12px; white-space: nowrap; }
  .nav-links a.nav-mobile-hide { display: none; }
  .nav-right { display: none; }
  /* ===== 移动端表格：只保留 用户/优先级/今日信号/跟进状态/操作 ===== */
  .col-hide-mobile { display: none; }
  /* ===== 移动端 Tab / 布局 ===== */
  .tabs { overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 10px 12px; font-size: 13px; white-space: nowrap; }
  .container { padding: 14px 12px 32px; }
  .page-title { font-size: 17px; }
  .page-sub { font-size: 12px; }
}
</style>
</head>
<body>

<nav class="top-nav">
  <div class="top-nav-inner">
    <a class="logo" href="/sales"><span class="icon">👗</span> airU 销售工作台</a>
    <div class="nav-links">
      <a href="/sales">今日概览</a>
      <a href="/sales/users" class="active">用户列表</a>
      <a href="/userBehavior" class="nav-mobile-hide">行为日志</a>
    </div>
    <div class="nav-right"><span id="nowText"></span></div>
  </div>
</nav>

<div class="container">
  <div class="page-title">高意向用户列表</div>
  <div class="page-sub">按 Priority = IntentScore × Momentum 排序，优先跟进正在升温的用户。</div>

  <!-- 4 个 Tab -->
  <div class="tabs" id="tabs">
    <button class="tab" data-tab="hot">🔥 今日重点<span class="count" id="cnt-hot">-</span></button>
    <button class="tab" data-tab="followup">📌 待跟进<span class="count" id="cnt-followup">-</span></button>
    <button class="tab" data-tab="crosssell">🛍️ 连带机会<span class="count" id="cnt-crosssell">-</span></button>
    <button class="tab" data-tab="all">👥 全部会员<span class="count" id="cnt-all">-</span></button>
  </div>

  <!-- 表格 -->
  <div class="table-section">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>用户</th>
            <th class="col-hide-mobile">意向分</th>
            <th class="col-hide-mobile">加速 ×</th>
            <th class="col-hide-mobile">优先级</th>
            <th>今日信号</th>
            <th class="col-hide-mobile">连带机会</th>
            <th class="col-hide-mobile">行为数</th>
            <th class="col-hide-mobile">跟进状态</th>
            <th style="min-width:120px;">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="9"><div class="loading"><div class="spinner"></div>加载中…</div></td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination">
      <div class="page-info" id="pageInfo"></div>
      <div class="page-btns">
        <button class="btn btn-outline" onclick="changePage(-1)">← 上一页</button>
        <button class="btn btn-outline" onclick="changePage(1)">下一页 →</button>
      </div>
    </div>
  </div>
</div>

<!-- 预约跟进弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3>📌 预约跟进</h3>
    <div class="form-item">
      <label>负责跟进人</label>
      <select id="fuOwner">
        <option value="">请选择</option>
        <option value="小林">小林</option>
        <option value="小付">小付</option>
        <option value="小陈">小陈</option>
        <option value="小葛">小葛</option>
        <option value="林老师">林老师</option>
        <option value="赵老师">赵老师</option>
      </select>
    </div>
    <div class="form-item">
      <label>跟进时间</label>
      <select id="fuPlanTime">
        <option value="今天下午">今天下午</option>
        <option value="明天上午">明天上午</option>
        <option value="明天下午">明天下午</option>
        <option value="后天">后天</option>
        <option value="本周内">本周内</option>
      </select>
    </div>
    <div class="form-item">
      <label>跟进内容 / 备注</label>
      <textarea id="fuNote" rows="3" placeholder="例如：围绕她收藏的西装整套推荐"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitFollowUp()">确认预约</button>
    </div>
  </div>
</div>

<script>
let curTab = 'hot';
let curPage = 1;
const PAGE_SIZE = 20;
let curUser = null;

const TAB_META = {
  hot: '今日重点',
  followup: '待跟进',
  crosssell: '连带机会',
  all: '全部会员'
};

// 从 URL 读取 tab
(function initTab() {
  const params = new URLSearchParams(location.search);
  if (params.get('tab') && TAB_META[params.get('tab')]) curTab = params.get('tab');
})();

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  curTab = btn.dataset.tab;
  curPage = 1;
  renderTabs();
  load();
});

function renderTabs() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === curTab));
}

function fmtTime(ts) {
  const d = new Date(ts);
  const pad = (x) => String(x).padStart(2, '0');
  return `${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
setInterval(() => {
  const d = new Date();
  document.getElementById('nowText').textContent = `${d.getMonth()+1}月${d.getDate()}日 ${d.getHours()}:${d.getMinutes()}`;
}, 1000);

function pill(p, type) {
  if (p >= 100) return `<span class="pill pill-red">🔥 ${p}</span>`;
  if (p >= 60) return `<span class="pill pill-amber">${p}</span>`;
  if (p >= 30) return `<span class="pill pill-blue">${p}</span>`;
  return `<span class="pill pill-gray">${p}</span>`;
}

function rowHTML(u) {
  const signals = [];
  if (u.isHeatingUp) signals.push('<span class="pill pill-red">⚡ 升温</span>');
  if (u.todayScore > 0) signals.push(`<span class="pill pill-blue">近48h ${Math.round(u.todayScore)}分</span>`);
  if (!signals.length) signals.push('<span class="pill pill-gray">—</span>');

  const cross = u.crosssellScore > 0
    ? `<span class="pill pill-green">${u.crosssellScore}分 · ¥${u.crosssellAmount.toLocaleString()}</span>`
    : '<span class="pill pill-gray">—</span>';

  const fu = u.followUp
    ? `<span class="fu-tag">📌 ${u.followUp.plan_time}</span>`
    : '<span class="pill pill-gray">未预约</span>';

  return `<tr onclick="goDetail('${encodeURIComponent(u.key)}')">
    <td>
      <div class="user-cell">
        <div class="avatar-sm">${u.displayName[0]}</div>
        <div class="u">
          <span class="u-name">${u.displayName}</span>
          <span class="u-id">${(u.uid || u.aid || '').slice(0, 16)}</span>
        </div>
      </div>
    </td>
    <td class="col-hide-mobile">${u.score}</td>
    <td class="col-hide-mobile">×${u.momentum}</td>
    <td class="col-hide-mobile"><div class="score-cell">${pill(u.priority)}<div class="score-bar-wrap"><div class="score-bar" style="width:${Math.min(100, u.priority)}%"></div></div></div></td>
    <td>${signals.join('')}</td>
    <td class="col-hide-mobile">${cross}</td>
    <td class="col-hide-mobile">${u.behaviorCount}</td>
    <td class="col-hide-mobile">${fu}</td>
    <td>
      <button class="btn btn-sm btn-primary" onclick="event.stopPropagation();openModal('${encodeURIComponent(u.key)}','${u.displayName}')">预约跟进</button>
      <button class="btn btn-sm btn-outline" onclick="event.stopPropagation();goDetail('${encodeURIComponent(u.key)}')">详情</button>
    </td>
  </tr>`;
}

async function load() {
  try {
    // 当前 tab + 各 tab 计数（并发）
    const [mainRes, hotRes, fuRes, crossRes, allRes] = await Promise.all([
      fetch(`/api/intent/users?tab=${curTab}&page=${curPage}&size=${PAGE_SIZE}`).then(r => r.json()),
      fetch('/api/intent/users?tab=hot&size=1').then(r => r.json()),
      fetch('/api/intent/users?tab=followup&size=1').then(r => r.json()),
      fetch('/api/intent/users?tab=crosssell&size=1').then(r => r.json()),
      fetch('/api/intent/users?tab=all&size=1').then(r => r.json()),
    ]);

    document.getElementById('cnt-hot').textContent = hotRes.data.total;
    document.getElementById('cnt-followup').textContent = fuRes.data.total;
    document.getElementById('cnt-crosssell').textContent = crossRes.data.total;
    document.getElementById('cnt-all').textContent = allRes.data.total;

    const { list, total, page, size } = mainRes.data;
    document.getElementById('tableBody').innerHTML = list.length
      ? list.map(rowHTML).join('')
      : '<tr><td colspan="9"><div class="empty-state">「' + TAB_META[curTab] + '」暂无用户</div></td></tr>';

    const totalPages = Math.max(1, Math.ceil(total / size));
    document.getElementById('pageInfo').textContent = `第 ${page} / ${totalPages} 页 · 共 ${total} 位用户`;
  } catch (e) {
    console.error(e);
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="9"><div class="empty-state">加载失败：' + e.message + '</div></td></tr>';
  }
}

function changePage(delta) {
  curPage = Math.max(1, curPage + delta);
  load();
}

function goDetail(key) {
  location.href = '/sales/user?key=' + key;
}

function openModal(key, name) {
  curUser = { key: decodeURIComponent(key), name };
  document.getElementById('modalMask').classList.add('show');
  document.getElementById('fuOwner').value = '';
  document.getElementById('fuNote').value = '';
}
function closeModal() { document.getElementById('modalMask').classList.remove('show'); }
document.getElementById('modalMask').addEventListener('click', (e) => { if (e.target.id === 'modalMask') closeModal(); });

async function submitFollowUp() {
  const planTime = document.getElementById('fuPlanTime').value;
  const note = document.getElementById('fuNote').value;
  const owner = document.getElementById('fuOwner').value;
  try {
    const res = await fetch('/api/follow-ups', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_key: curUser.key, display_name: curUser.name, plan_time: planTime, note, owner })
    });
    const json = await res.json();
    if (json.code === 0) { closeModal(); load(); } else { alert(json.msg); }
  } catch (e) { alert('预约失败：' + e.message); }
}

renderTabs();
load();
setInterval(load, 60000);
</script>
</body>
</html>
