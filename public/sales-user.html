<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户详情销售工作台 | airU</title>
<style>
:root {
  --primary: #4F46E5;
  --primary-dark: #4338CA;
  --primary-light: #EEF2FF;
  --bg: #F3F4F6;
  --card-bg: #FFFFFF;
  --text: #111827;
  --text-muted: #6B7280;
  --border: #E5E7EB;
  --border-dark: #D1D5DB;
  --green: #10B981;
  --green-light: #D1FAE5;
  --amber: #F59E0B;
  --amber-light: #FEF3C7;
  --red: #EF4444;
  --red-light: #FEE2E2;
  --blue: #3B82F6;
  --blue-light: #DBEAFE;
  --purple: #8B5CF6;
  --purple-light: #EDE9FE;
  --pink: #EC4899;
  --pink-light: #FCE7F3;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

/* ===== 统一顶部导航 ===== */
.top-nav { background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.top-nav-inner { max-width: 1400px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; height: 56px; gap: 24px; }
.top-nav .logo { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; }
.top-nav .logo .icon { font-size: 20px; }
.nav-links { display: flex; gap: 4px; flex: 1; }
.nav-links a { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--text-muted); text-decoration: none; transition: all 0.2s; }
.nav-links a:hover { background: var(--bg); color: var(--text); }
.nav-links a.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.nav-right { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-muted); }

/* ===== 布局 ===== */
.container { max-width: 1400px; margin: 0 auto; padding: 20px 24px 40px; }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 13px; margin-bottom: 14px; }
.back-link:hover { color: var(--primary); }

/* ===== 用户头部 ===== */
.user-hero { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
.u-info { display: flex; gap: 16px; align-items: center; }
.avatar-lg { width: 56px; height: 56px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; }
.u-name-lg { font-size: 20px; font-weight: 700; }
.u-id-lg { font-size: 12px; color: var(--text-muted); font-family: monospace; margin-top: 4px; }
.u-tags { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.u-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { padding: 10px 18px; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: #059669; }
.btn-outline { background: var(--card-bg); border: 1px solid var(--border-dark); color: var(--text); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 6px 12px; font-size: 12px; }

/* ===== 指标卡片 ===== */
.metrics-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 20px; }
.metric-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-align: center; }
.metric-card .mk { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
.metric-card .mv { font-size: 24px; font-weight: 700; }
.metric-card .md { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
.metric-card .mv.hot { color: var(--red); }
.metric-card .mv.green { color: var(--green); }

/* ===== 双栏 ===== */
.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-bottom: 20px; }
.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
.card-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
.card-title .sub { font-size: 12px; color: var(--text-muted); font-weight: 400; }

/* 建议话术 */
.suggest-item { background: var(--primary-light); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.suggest-item:last-child { margin-bottom: 0; }
.suggest-item .s-label { font-size: 11px; color: var(--primary); font-weight: 600; margin-bottom: 4px; }
.suggest-item .s-text { font-size: 13px; line-height: 1.6; color: var(--text); }

/* 评分明细 */
.detail-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
.detail-row:last-child { border-bottom: none; }
.detail-row .d-label { color: var(--text); }
.detail-row .d-event { font-size: 11px; color: var(--text-muted); font-family: monospace; }
.detail-row .d-point { font-weight: 600; color: var(--primary); }

/* ===== Timeline ===== */
.timeline { position: relative; padding-left: 20px; }
.timeline::before { content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.tl-item { position: relative; padding: 8px 0 8px 14px; }
.tl-item::before { content: ''; position: absolute; left: -18px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.tl-item .tl-time { font-size: 11px; color: var(--text-muted); }
.tl-item .tl-event { font-size: 13px; font-weight: 500; margin-top: 2px; }
.tl-item .tl-extra { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.tl-item .tl-event .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; margin-left: 6px; background: var(--bg); color: var(--text-muted); font-weight: 400; }

/* 连带机会 */
.cs-box { background: var(--green-light); border: 1px solid #A7F3D0; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.cs-box .cs-amount { font-size: 20px; font-weight: 700; color: #065F46; }
.cs-box .cs-reason { font-size: 12px; color: #065F46; margin-top: 4px; line-height: 1.6; }

/* 跟进记录 */
.fu-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--bg); margin-bottom: 8px; }
.fu-item:last-child { margin-bottom: 0; }
.fu-item .fu-info { font-size: 13px; }
.fu-item .fu-plan { color: var(--text-muted); font-size: 12px; }
.fu-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
.fu-pending { background: var(--amber-light); color: #92400E; }
.fu-done { background: var(--green-light); color: #065F46; }
.fu-canceled { background: var(--bg); color: var(--text-muted); }

/* 空态/加载 */
.empty-state { text-align: center; padding: 32px 20px; color: var(--text-muted); font-size: 13px; }
.loading { text-align: center; padding: 40px; color: var(--text-muted); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; margin: 0 auto 12px; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 弹窗 */
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 200; }
.modal-mask.show { display: flex; }
.modal { background: var(--card-bg); border-radius: 14px; padding: 24px; width: 460px; max-width: 92vw; max-height: 90vh; overflow-y: auto; }
.modal h3 { font-size: 16px; margin-bottom: 16px; }
.form-item { margin-bottom: 14px; }
.form-item label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
.form-item input, .form-item select, .form-item textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border-dark); border-radius: 8px; font-size: 13px; outline: none; background: var(--card-bg); color: var(--text); }
.form-item input:focus, .form-item select:focus, .form-item textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.gen-result { background: var(--bg); border-radius: 10px; padding: 12px; margin-top: 10px; font-size: 13px; line-height: 1.7; }
.gen-result .item { padding: 6px 0; border-bottom: 1px dashed var(--border); }
.gen-result .item:last-child { border-bottom: none; }

@media (max-width: 1100px) {
  .metrics-row { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .metrics-row { grid-template-columns: repeat(2, 1fr); }
  /* ===== 移动端导航适配 ===== */
  .top-nav-inner { padding: 0 10px; gap: 8px; height: 52px; }
  .top-nav .logo { font-size: 14px; gap: 4px; white-space: nowrap; }
  .top-nav .logo .icon { font-size: 18px; }
  .nav-links { gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-links a { padding: 6px 8px; font-size: 12px; white-space: nowrap; }
  .nav-links a.nav-mobile-hide { display: none; }
  .nav-right { display: none; }
}
</style>
</head>
<body>

<nav class="top-nav">
  <div class="top-nav-inner">
    <a class="logo" href="/sales"><span class="icon">👗</span> airU 销售工作台</a>
    <div class="nav-links">
      <a href="/sales">今日概览</a>
      <a href="/sales/users">用户列表</a>
      <a href="/userBehavior" class="nav-mobile-hide">行为日志</a>
    </div>
    <div class="nav-right"><span id="nowText"></span></div>
  </div>
</nav>

<div class="container" id="pageRoot">
  <div class="loading"><div class="spinner"></div>加载用户数据…</div>
</div>

<!-- 预约跟进弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3>📌 预约跟进</h3>
    <div class="form-item">
      <label>跟进时间</label>
      <select id="fuPlanTime">
        <option value="今天下午">今天下午</option>
        <option value="明天上午">明天上午</option>
        <option value="明天下午">明天下午</option>
        <option value="后天">后天</option>
        <option value="本周内">本周内</option>
      </select>
    </div>
    <div class="form-item">
      <label>跟进内容 / 备注</label>
      <textarea id="fuNote" rows="3" placeholder="例如：围绕她收藏的西装整套推荐"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitFollowUp()">确认预约</button>
    </div>
  </div>
</div>

<!-- 生成穿搭弹窗 -->
<div class="modal-mask" id="genMask">
  <div class="modal">
    <h3>🎨 制作下一套穿搭</h3>
    <div class="form-item">
      <label>穿搭主题</label>
      <select id="genStyle">
        <option value="通勤">通勤</option>
        <option value="休闲">休闲</option>
        <option value="约会">约会</option>
        <option value="度假">度假</option>
        <option value="根据用户偏好">根据用户偏好</option>
      </select>
    </div>
    <div class="form-item">
      <label>数量</label>
      <select id="genCount">
        <option value="2">2 套</option>
        <option value="3" selected>3 套</option>
      </select>
    </div>
    <button class="btn btn-green" style="width:100%;justify-content:center;" onclick="generateOutfit()">✨ 生成搭配</button>
    <div id="genResult"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeGen()">关闭</button>
    </div>
  </div>
</div>

<script>
let userKey = '';
let userData = null;

(function init() {
  const params = new URLSearchParams(location.search);
  userKey = params.get('key') || params.get('uid') || '';
  if (!userKey) {
    document.getElementById('pageRoot').innerHTML = '<div class="empty-state">缺少用户 key 参数，请从列表进入</div>';
    return;
  }
  load();
})();

setInterval(() => {
  const d = new Date();
  const pad = (x) => String(x).padStart(2, '0');
  document.getElementById('nowText').textContent = `${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}, 1000);

function fmtTime(ts) {
  const d = new Date(ts);
  const pad = (x) => String(x).padStart(2, '0');
  return `${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

// 生成建议话术（基于行为信号）
function buildSuggestions(u) {
  const list = [];
  const base = `【${u.displayName}】意向分 ${u.score}，最近 ${u.behaviorCount} 次行为`;
  if (u.isHeatingUp) {
    list.push(`【主动联系】${u.displayName} 正在升温（加速 ×${u.momentum}），今天联系转化概率最高，建议优先微信沟通。`);
  }
  if (u.crosssellScore > 0) {
    list.push(`【连带推荐】围绕她已收藏/浏览的商品整套推荐，潜在连带金额约 ¥${u.crosssellAmount.toLocaleString()}。`);
  }
  if (u.collectedLooks > 0) {
    list.push(`【回访收藏】她收藏了 ${u.collectedLooks} 件 Look，可以提醒优惠活动或帮她对比款式。`);
  }
  if (u.viewedSkus > 0) {
    list.push(`【尺码跟进】她查看了 ${u.viewedSkus} 个商品，可以主动确认尺码并给出搭配建议。`);
  }
  if (!list.length) {
    list.push(`【初步接触】${base}，可以先做一次轻量触达，了解她的穿搭偏好。`);
  }
  return list.slice(0, 3);
}

async function load() {
  try {
    const res = await fetch(`/api/intent/user?key=${encodeURIComponent(userKey)}`);
    const json = await res.json();
    if (json.code !== 0 || !json.data) throw new Error(json.msg || '未找到用户');
    userData = json.data;
    render(json.data);
  } catch (e) {
    document.getElementById('pageRoot').innerHTML = '<div class="empty-state">加载失败：' + e.message + '</div>';
  }
}

function render(u) {
  const signals = [];
  if (u.isHeatingUp) signals.push('<span class="pill pill-red">⚡ 正在升温</span>');
  if (u.crosssellScore > 0) signals.push('<span class="pill pill-green">🛍 连带机会</span>');
  const pillCSS = `<style>.pill{display:inline-block;padding:3px 12px;border-radius:12px;font-size:12px;font-weight:600}.pill-red{background:var(--red-light);color:var(--red)}.pill-green{background:var(--green-light);color:#065F46}</style>`;

  // 建议话术
  const suggestions = buildSuggestions(u).map((s, i) =>
    `<div class="suggest-item"><div class="s-label">建议 ${i + 1}</div><div class="s-text">${s}</div></div>`
  ).join('');

  // 评分明细
  const details = (u.scoreDetails || []).map(d =>
    `<div class="detail-row"><span class="d-label">${d.label}</span><span class="d-event">${d.event}</span><span class="d-point">+${d.point}</span></div>`
  ).join('') || '<div class="empty-state">暂无评分明细</div>';

  // Timeline
  const timeline = (u.timeline || []).map(t => {
    const extraStr = Object.keys(t.extra || {}).length
      ? `<div class="tl-extra">${Object.entries(t.extra).map(([k, v]) => `${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' · ')}</div>`
      : '';
    return `<div class="tl-item"><div class="tl-time">${t.formattedTime}</div><div class="tl-event">${t.event}${t.eventMsg ? `<span class="tag">${t.eventMsg}</span>` : ''}</div>${extraStr}</div>`;
  }).join('');

  // 连带机会
  const csHTML = u.crosssellScore > 0
    ? `<div class="cs-box"><div class="cs-amount">潜在金额 ¥${u.crosssellAmount.toLocaleString()}</div><div class="cs-reason">${u.crosssellReasons.join(' · ')}</div><div style="margin-top:10px;"><button class="btn btn-sm btn-primary" onclick="openGen()">🎨 制作下一套穿搭</button></div></div>`
    : '<div class="empty-state">暂无连带机会</div>';

  // 跟进记录
  const fus = (u.followUps || []);
  const fuHTML = fus.length ? fus.map(f => {
    const st = f.status === 'pending' ? '<span class="fu-status fu-pending">待跟进</span>' : f.status === 'done' ? '<span class="fu-status fu-done">已完成</span>' : '<span class="fu-status fu-canceled">已取消</span>';
    const act = f.status === 'pending'
      ? `<div style="display:flex;gap:6px;">${st}<button class="btn btn-sm btn-outline" onclick="setFuStatus(${f.id},'done')">完成</button><button class="btn btn-sm btn-outline" onclick="setFuStatus(${f.id},'canceled')">取消</button></div>`
      : st;
    return `<div class="fu-item"><div><div class="fu-info">📌 ${f.plan_time || '未设时间'}${f.note ? ` · ${f.note}` : ''}</div><div class="fu-plan">${fmtTime(f.created_at)} 创建</div></div>${act}</div>`;
  }).join('') : '<div class="empty-state">暂无跟进记录，点击右上角「预约跟进」</div>';

  document.getElementById('pageRoot').innerHTML = `
    ${pillCSS}
    <a class="back-link" href="/sales/users">← 返回用户列表</a>

    <!-- 用户头部 -->
    <div class="user-hero">
      <div class="u-info">
        <div class="avatar-lg">${u.displayName[0]}</div>
        <div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="u-name-lg">${u.displayName}</span>
            ${signals.join('')}
          </div>
          <div class="u-id-lg">${u.uid || u.aid || ''} · ${u.aid || ''}</div>
          <div class="u-tags">
            <span class="pill pill-red">意向分 ${u.score}</span>
            <span class="pill pill-red">优先级 ${u.priority}</span>
            <span class="pill pill-green">加速 ×${u.momentum}</span>
            <span class="pill pill-green">${u.behaviorCount} 次行为</span>
            <span class="pill pill-green">${u.openDays} 天活跃</span>
          </div>
        </div>
      </div>
      <div class="u-actions">
        <button class="btn btn-green" onclick="openGen()">🎨 制作下一套穿搭</button>
        <button class="btn btn-primary" onclick="openModal()">📌 预约跟进</button>
      </div>
    </div>

    <!-- 指标 -->
    <div class="metrics-row">
      <div class="metric-card"><div class="mk">意向分 IntentScore</div><div class="mv hot">${u.score}</div><div class="md">Σ W×F×R</div></div>
      <div class="metric-card"><div class="mk">意向加速 Momentum</div><div class="mv">×${u.momentum}</div><div class="md">近 48h 活跃窗口</div></div>
      <div class="metric-card"><div class="mk">综合优先级</div><div class="mv">${u.priority}</div><div class="md">IntentScore × Momentum</div></div>
      <div class="metric-card"><div class="mk">连带评分</div><div class="mv">${u.crosssellScore}</div><div class="md">Cross-sell Score</div></div>
      <div class="metric-card"><div class="mk">潜在连带金额</div><div class="mv green">¥${(u.crosssellAmount||0).toLocaleString()}</div><div class="md">预估连带销售</div></div>
    </div>

    <!-- 双栏 -->
    <div class="grid-2">
      <div>
        <!-- Timeline -->
        <div class="card" style="margin-bottom:20px;">
          <div class="card-title">📜 行为时间线 <span class="sub">最近 50 条</span></div>
          <div class="timeline" style="max-height:420px;overflow-y:auto;">${timeline || '<div class="empty-state">暂无行为记录</div>'}</div>
        </div>
        <!-- 评分明细 -->
        <div class="card">
          <div class="card-title">🧮 评分明细 <span class="sub">IntentScore = Σ(W×F×R)</span></div>
          <div style="max-height:300px;overflow-y:auto;">${details}</div>
        </div>
      </div>
      <div>
        <!-- 建议话术 -->
        <div class="card" style="margin-bottom:20px;">
          <div class="card-title">💬 建议话术</div>
          ${suggestions}
        </div>
        <!-- 连带机会 -->
        <div class="card" style="margin-bottom:20px;">
          <div class="card-title">🛍️ 连带销售机会</div>
          ${csHTML}
        </div>
        <!-- 跟进记录 -->
        <div class="card">
          <div class="card-title">📌 跟进记录</div>
          ${fuHTML}
        </div>
      </div>
    </div>
  `;
}

/* ===== 弹窗 ===== */
let curUserKey = '';

function openModal() { document.getElementById('modalMask').classList.add('show'); document.getElementById('fuNote').value = ''; }
function closeModal() { document.getElementById('modalMask').classList.remove('show'); }
document.getElementById('modalMask').addEventListener('click', (e) => { if (e.target.id === 'modalMask') closeModal(); });

async function submitFollowUp() {
  const planTime = document.getElementById('fuPlanTime').value;
  const note = document.getElementById('fuNote').value;
  try {
    const res = await fetch('/api/follow-ups', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_key: userData.key, display_name: userData.displayName, plan_time: planTime, note })
    });
    const json = await res.json();
    if (json.code === 0) { closeModal(); load(); } else { alert(json.msg); }
  } catch (e) { alert('预约失败：' + e.message); }
}

async function setFuStatus(id, status) {
  const res = await fetch(`/api/follow-ups/${id}/status`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status })
  });
  const json = await res.json();
  if (json.code === 0) load(); else alert(json.msg);
}

/* ===== 生成穿搭 ===== */
function openGen() { document.getElementById('genMask').classList.add('show'); document.getElementById('genResult').innerHTML = ''; }
function closeGen() { document.getElementById('genMask').classList.remove('show'); }
document.getElementById('genMask').addEventListener('click', (e) => { if (e.target.id === 'genMask') closeGen(); });

function generateOutfit() {
  const style = document.getElementById('genStyle').value;
  const count = parseInt(document.getElementById('genCount').value) || 3;
  const name = userData.displayName;
  const anchors = userData.collectedLooks || 1;

  const items = [
    ['通勤', ['米色西装', '直筒西裤', '真丝衬衫'], ['通勤外套', '阔腿裤', '针织内搭']],
    ['休闲', ['oversize 卫衣', '直筒牛仔裤', '帆布鞋'], ['基础 T 恤', '休闲裤', '运动鞋']],
    ['约会', ['碎花连衣裙', '针织开衫', '小方包'], ['收腰连衣裙', '蕾丝上衣', '半身裙']],
    ['度假', ['亚麻衬衫', '阔腿裤', '草帽'], ['印花长裙', '吊带背心', '凉鞋']],
    ['根据用户偏好', ['针织衫', '半身裙', '乐福鞋'], ['衬衫', '牛仔裤', '小白鞋']]
  ];
  const chosen = items.find(i => i[0] === style) || items[4];

  const looks = [];
  for (let i = 0; i < count; i++) {
    const itemsArr = chosen[1].map((it, j) => `${it} ${chosen[2][j % chosen[2].length]}`);
    const total = 1280 + 980 + 560 + (i * 160);
    looks.push(`<div class="item">🎨 方案 ${i + 1}：${itemsArr.join(' + ')}<br><span style="color:var(--green);font-weight:600;">参考价 ¥${total.toLocaleString()}</span></div>`);
  }
  document.getElementById('genResult').innerHTML = `<div class="gen-result"><div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">基于【${name}】的收藏/浏览偏好生成：</div>${looks.join('')}<div style="padding-top:8px;color:var(--text-muted);font-size:12px;">💡 可微调后通过企业微信发送给用户</div></div>`;
}
