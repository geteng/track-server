<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>airU+原型demo用户行为日志后台</title>
<style>
:root {
  --primary: #4F46E5;
  --primary-light: #EEF2FF;
  --bg: #F9FAFB;
  --card-bg: #FFFFFF;
  --text: #111827;
  --text-muted: #6B7280;
  --border: #E5E7EB;
  --border-dark: #D1D5DB;
  --green: #10B981;
  --amber: #F59E0B;
  --red: #EF4444;
  --blue: #3B82F6;
  --purple: #8B5CF6;
  --pink: #EC4899;
  --gray: #6B7280;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

/* 统一顶部导航（与销售工作台一致） */
.top-nav { background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.top-nav-inner { max-width: 1400px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; height: 56px; gap: 24px; }
.top-nav .logo { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; }
.top-nav .logo .icon { font-size: 20px; }
.nav-links { display: flex; gap: 4px; flex: 1; }
.nav-links a { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--text-muted); text-decoration: none; transition: all 0.2s; }
.nav-links a:hover { background: var(--bg); color: var(--text); }
.nav-links a.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.nav-right { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-muted); }
.auto-refresh-label { font-size: 12px; color: var(--text-muted); }
@media (max-width: 768px) {
  /* ===== 移动端导航适配（不再隐藏，改为紧凑显示） ===== */
  .top-nav-inner { padding: 0 10px; gap: 8px; height: 52px; }
  .top-nav .logo { font-size: 14px; gap: 4px; white-space: nowrap; }
  .top-nav .logo .icon { font-size: 18px; }
  .nav-links { gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-links a { padding: 6px 8px; font-size: 12px; white-space: nowrap; }
  .nav-links a.nav-mobile-hide { display: none; }
  .nav-right { display: none; }
}

/* 页面标题 */
.page-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

/* Container */
.container { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }

/* Filter Bar */
.filter-bar { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.filter-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
.filter-row:last-child { margin-bottom: 0; }
.filter-item { display: flex; flex-direction: column; gap: 4px; }
.filter-item label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
.filter-item input, .filter-item select { height: 36px; padding: 0 12px; border: 1px solid var(--border-dark); border-radius: 8px; font-size: 13px; background: var(--card-bg); color: var(--text); outline: none; transition: border-color 0.2s; }
.filter-item input:focus, .filter-item select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
.filter-item input { min-width: 180px; }
.quick-time { display: flex; gap: 6px; }
.quick-btn { padding: 6px 14px; border: 1px solid var(--border-dark); border-radius: 6px; background: var(--card-bg); cursor: pointer; font-size: 12px; color: var(--text-muted); transition: all 0.2s; }
.quick-btn:hover { border-color: var(--primary); color: var(--primary); }
.quick-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn { height: 36px; padding: 0 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #4338CA; }
.btn-secondary { background: var(--card-bg); border: 1px solid var(--border-dark); color: var(--text); }
.btn-secondary:hover { background: var(--bg); }
.btn-export { background: var(--green); color: #fff; }
.btn-export:hover { background: #059669; }

/* Stats Cards */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.stat-card .label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
.stat-card .value { font-size: 28px; font-weight: 700; }
.stat-card .detail { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
.stat-card .detail span { color: var(--text); font-weight: 500; }

/* Trend Chart */
.chart-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.chart-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
.chart-bars { display: flex; align-items: flex-end; gap: 2px; height: 120px; overflow-x: auto; }
.chart-bar { flex: 1; min-width: 4px; background: var(--primary); opacity: 0.7; border-radius: 3px 3px 0 0; position: relative; cursor: pointer; transition: opacity 0.2s; }
.chart-bar:hover { opacity: 1; }
.chart-bar:hover::after { content: attr(data-label); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap; margin-bottom: 4px; }
.chart-empty { text-align: center; color: var(--text-muted); line-height: 120px; }

/* Table */
.table-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; min-width: 1280px; border-collapse: collapse; }
/* 操作列固定在右侧，横向滚动时始终可点 */
th:last-child, td:last-child { position: sticky; right: 0; }
th:last-child { background: var(--bg); z-index: 3; }
td:last-child { background: var(--card-bg); z-index: 2; }
tr:hover td:last-child { background: var(--card-bg); }
thead { background: var(--bg); }
th { padding: 12px 16px; text-align: left; font-size: 12px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 10px 16px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: var(--primary-light); }
.truncate { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ua-short { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }

/* Event Tags */
.event-tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.ev-page_view { background: #DBEAFE; color: #1E40AF; }
.ev-btn_click_tryon { background: #FEF3C7; color: #92400E; }
.ev-btn_click_customize { background: #FEF3C7; color: #92400E; }
.ev-btn_click_note { background: #FEF3C7; color: #92400E; }
.ev-btn_click_look { background: #FEF3C7; color: #92400E; }
.ev-tab_switch { background: #EDE9FE; color: #5B21B6; }
.ev-swipe_look { background: #D1FAE5; color: #065F46; }
.ev-leave_page { background: #FEE2E2; color: #991B1B; }
.ev-share_click { background: #FCE7F3; color: #9D174D; }
.ev-default { background: #F3F4F6; color: #374151; }

/* Aid Link */
.aid-link { color: var(--primary); cursor: pointer; font-family: monospace; font-size: 12px; }
.aid-link:hover { text-decoration: underline; }
.uid-link { color: var(--purple); cursor: pointer; font-family: monospace; font-size: 12px; }
.uid-link:hover { text-decoration: underline; }

/* Crawler badge */
.crawler-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; background: #FEE2E2; color: #991B1B; margin-left: 4px; }

/* Action Button */
.btn-detail { padding: 4px 12px; border: 1px solid var(--primary); border-radius: 6px; background: transparent; color: var(--primary); cursor: pointer; font-size: 12px; }
.btn-detail:hover { background: var(--primary); color: #fff; }

/* Pagination */
.pagination { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
.page-info { font-size: 13px; color: var(--text-muted); }
.page-buttons { display: flex; gap: 6px; }
.page-btn { min-width: 32px; height: 32px; border: 1px solid var(--border-dark); border-radius: 6px; background: var(--card-bg); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 200; }
.modal-overlay.show { display: flex; }
.modal { background: var(--card-bg); border-radius: 12px; width: 90%; max-width: 640px; max-height: 85vh; overflow-y: auto; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--card-bg); z-index: 1; }
.modal-header h2 { font-size: 16px; font-weight: 600; }
.modal-close { width: 32px; height: 32px; border: none; background: none; font-size: 20px; cursor: pointer; color: var(--text-muted); border-radius: 6px; }
.modal-close:hover { background: var(--bg); }
.modal-body { padding: 24px; }
.detail-section { margin-bottom: 24px; }
.detail-section h3 { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.detail-item { display: flex; flex-direction: column; gap: 2px; }
.detail-item .key { font-size: 12px; color: var(--text-muted); }
.detail-item .val { font-size: 13px; font-weight: 500; word-break: break-all; }
.json-block { background: #1E293B; color: #E2E8F0; padding: 16px; border-radius: 8px; font-family: "SF Mono", Monaco, monospace; font-size: 12px; line-height: 1.6; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
.raw-log { background: var(--bg); padding: 12px; border-radius: 8px; font-family: monospace; font-size: 12px; color: var(--text-muted); word-break: break-all; }
.copy-btn { padding: 4px 10px; border: 1px solid var(--border-dark); border-radius: 6px; background: var(--card-bg); cursor: pointer; font-size: 12px; color: var(--text-muted); }
.copy-btn:hover { border-color: var(--primary); color: var(--primary); }

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--text-muted); }
.no-data { text-align: center; padding: 40px; color: var(--text-muted); }

/* Notice */
.notice { background: #FEF3C7; border: 1px solid #FDE68A; border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #92400E; margin-bottom: 12px; display: none; }

@media (max-width: 768px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .filter-row { flex-direction: column; }
  .filter-item input { min-width: 100%; }
  .detail-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- 统一顶部导航（与销售工作台一致） -->
<nav class="top-nav">
  <div class="top-nav-inner">
    <a class="logo" href="/sales"><span class="icon">👗</span> airU 销售工作台</a>
    <div class="nav-links">
      <a href="/sales">今日概览</a>
      <a href="/sales#/users">用户列表</a>
      <a href="/userBehavior" class="active nav-mobile-hide">行为日志</a>
    </div>
    <div class="nav-right">
      <label class="auto-refresh-label"><input type="checkbox" id="autoRefresh"> 自动刷新(30s)</label>
      <button class="btn btn-secondary" onclick="loadData()">🔄 刷新</button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="page-title">📊 airU+ 用户行为日志后台</div>
  <div class="page-sub">实时查看小程序上报的原始埋点数据，支持时间过滤、事件检索与 CSV 导出。</div>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <div class="filter-row">
      <div class="filter-item">
        <label>开始时间</label>
        <input type="datetime-local" id="startTime">
      </div>
      <div class="filter-item">
        <label>结束时间</label>
        <input type="datetime-local" id="endTime">
      </div>
      <div class="filter-item">
        <label>快捷选择</label>
        <div class="quick-time">
          <button class="quick-btn" onclick="setQuickTime(1)">近1小时</button>
          <button class="quick-btn active" onclick="setQuickTime(24)">近24小时</button>
          <button class="quick-btn" onclick="setQuickTime(168)">近7天</button>
          <button class="quick-btn" onclick="setQuickTime(0)">全部</button>
        </div>
      </div>
    </div>
    <div class="filter-row">
      <div class="filter-item">
        <label>事件类型</label>
        <select id="eventFilter" style="min-width:180px;">
          <option value="">全部事件</option>
        </select>
      </div>
      <div class="filter-item">
        <label>匿名用户ID</label>
        <input type="text" id="aidFilter" placeholder="输入 aid 搜索">
      </div>
      <div class="filter-item">
        <label>登录用户UID</label>
        <input type="text" id="uidFilter" placeholder="输入 uid 搜索">
      </div>
      <div class="filter-item">
        <label>页面URL</label>
        <input type="text" id="urlFilter" placeholder="模糊搜索URL">
      </div>
      <div class="filter-item">
        <label>&nbsp;</label>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary" onclick="loadData(1)">🔍 查询</button>
          <button class="btn btn-secondary" onclick="resetFilters()">🔄 重置</button>
          <button class="btn btn-export" onclick="exportCSV()">📥 导出CSV</button>
        </div>
      </div>
    </div>
  </div>

  <div class="notice" id="leaveNotice">
    💡 提示：unload/页面离开事件常会批量上报，时间接近属正常现象
  </div>

  <!-- Stats Cards -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="label">总日志条数</div>
      <div class="value" id="statTotal">-</div>
    </div>
    <div class="stat-card">
      <div class="label">独立访客</div>
      <div class="value" id="statUsers">-</div>
    </div>
    <div class="stat-card">
      <div class="label">PV (page_view)</div>
      <div class="value" id="statPV">-</div>
    </div>
    <div class="stat-card">
      <div class="label">TOP 事件</div>
      <div class="value" style="font-size:14px;" id="statTopEvents">-</div>
    </div>
  </div>

  <!-- Trend Chart -->
  <div class="chart-section">
    <div class="chart-title">
      <span>📈 事件趋势（按小时聚合）</span>
      <span style="font-size:12px;color:var(--text-muted);" id="chartHint">悬停查看详情</span>
    </div>
    <div class="chart-bars" id="chartBars">
      <div class="chart-empty">加载中...</div>
    </div>
  </div>

  <!-- Data Table -->
  <div class="table-section">
    <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>时间</th>
          <th>AID</th>
          <th>UID</th>
          <th>事件</th>
          <th>事件详情</th>
          <th>页面URL</th>
          <th>来源</th>
          <th>屏幕</th>
          <th>UA</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="11" class="loading">加载中...</td></tr>
      </tbody>
    </table>
    </div>
    <div class="pagination">
      <div class="page-info" id="pageInfo">-</div>
      <div class="page-buttons" id="pageButtons"></div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>日志详情</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="loading">加载中...</div>
    </div>
  </div>
</div>

<script>
const API_BASE = '/api/behavior-log';
let currentPage = 1;
let currentPageSize = 20;
let totalRecords = 0;
let refreshTimer = null;

// ===== 工具函数 =====
function tsToInput(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function inputToTs(val) {
  if (!val) return null;
  return new Date(val).getTime();
}
function formatTime(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function formatHour(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:00`;
}
function getEventClass(event) {
  const cls = 'ev-' + event.replace(/[^a-zA-Z0-9_]/g, '_');
  return document.styleSheets[0] ? cls : 'ev-default';
}
function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== 快捷时间 =====
function setQuickTime(hours) {
  document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  const now = Date.now();
  if (hours === 0) {
    document.getElementById('startTime').value = '';
    document.getElementById('endTime').value = '';
  } else {
    document.getElementById('startTime').value = tsToInput(now - hours * 3600000);
    document.getElementById('endTime').value = tsToInput(now);
  }
  loadData(1);
}

// ===== 加载事件列表 =====
async function loadEvents() {
  try {
    const res = await fetch(`${API_BASE}/events`);
    const json = await res.json();
    if (json.code === 0) {
      const sel = document.getElementById('eventFilter');
      const current = sel.value;
      sel.innerHTML = '<option value="">全部事件</option>';
      json.data.forEach(ev => {
        const opt = document.createElement('option');
        opt.value = ev;
        opt.textContent = ev;
        sel.appendChild(opt);
      });
      sel.value = current;
    }
  } catch (e) { console.error('加载事件列表失败', e); }
}

// ===== 加载数据 =====
async function loadData(page) {
  if (page) currentPage = page;

  const params = new URLSearchParams();
  params.set('page', currentPage);
  params.set('size', currentPageSize);

  const st = inputToTs(document.getElementById('startTime').value);
  const et = inputToTs(document.getElementById('endTime').value);
  if (st) params.set('startTime', st);
  if (et) params.set('endTime', et);

  const ev = document.getElementById('eventFilter').value;
  if (ev) params.set('event', ev);

  const aid = document.getElementById('aidFilter').value.trim();
  if (aid) params.set('aid', aid);

  const uid = document.getElementById('uidFilter').value.trim();
  if (uid) params.set('uid', uid);

  const url = document.getElementById('urlFilter').value.trim();
  if (url) params.set('url', url);

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '<tr><td colspan="11" class="loading">加载中...</td></tr>';

  try {
    const res = await fetch(`${API_BASE}/list?${params}`);
    const json = await res.json();

    if (json.code !== 0) {
      tbody.innerHTML = `<tr><td colspan="11" class="no-data">查询失败: ${json.msg}</td></tr>`;
      return;
    }

    const { list, total, stats, trend } = json.data;
    totalRecords = total;

    // 渲染统计
    document.getElementById('statTotal').textContent = stats.total;
    document.getElementById('statUsers').textContent = stats.uniqueUsers;
    document.getElementById('statPV').textContent = stats.pvCount;
    const topHtml = stats.topEvents.map(e => `${escapeHtml(e.event)}(${e.count})`).join('<br>');
    document.getElementById('statTopEvents').innerHTML = topHtml || '-';

    // 渲染趋势图
    renderChart(trend || []);

    // 渲染表格
    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="11" class="no-data">暂无数据</td></tr>';
    } else {
      tbody.innerHTML = list.map(row => {
        let extraObj = {};
        try { extraObj = JSON.parse(row.extra || '{}'); } catch(e) {}
        const isCrawler = /bot|crawler|spider|scrap|slurp|baidu|googlebot/i.test(row.userAgent || '');
        const evClass = getEventClass(row.event);
        const leaveHighlight = row.event === 'leave_page' ? 'style="background:#FFFBEB;"' : '';

        return `<tr ${leaveHighlight}>
          <td>${row.id}</td>
          <td style="white-space:nowrap;">${formatTime(row.timestamp)}</td>
          <td><span class="aid-link" onclick="filterByAid('${escapeHtml(row.aid)}')">${escapeHtml(row.aid)}</span></td>
          <td><span class="uid-link" onclick="filterByUid('${escapeHtml(row.uid)}')">${escapeHtml(row.uid) || '-'}</span></td>
          <td><span class="event-tag ${evClass}" onclick="filterByEvent('${escapeHtml(row.event)}')">${escapeHtml(row.event)}</span>${isCrawler ? '<span class="crawler-badge">爬虫</span>' : ''}</td>
          <td><div class="truncate" title="${escapeHtml(row.eventMsg)}">${escapeHtml(row.eventMsg) || '-'}</div></td>
          <td><div class="truncate" title="${escapeHtml(row.url)}">${escapeHtml(row.url)}</div></td>
          <td><div class="truncate" style="color:var(--text-muted);" title="${escapeHtml(row.referrer)}">${escapeHtml(row.referrer) || '-'}</div></td>
          <td style="white-space:nowrap;">${escapeHtml(row.screen) || '-'}</td>
          <td><div class="ua-short" title="${escapeHtml(row.userAgent)}">${escapeHtml(row.userAgent)}</div></td>
          <td><button class="btn-detail" onclick="showDetail(${row.id})">详情</button></td>
        </tr>`;
      }).join('');
    }

    // 渲染分页
    renderPagination();

    // 检查是否有 leave_page 事件
    const hasLeave = list.some(r => r.event === 'leave_page');
    document.getElementById('leaveNotice').style.display = hasLeave ? 'block' : 'none';

  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="11" class="no-data">请求失败: ${e.message}</td></tr>`;
  }
}

// ===== 渲染趋势图 =====
function renderChart(trend) {
  const container = document.getElementById('chartBars');
  if (!trend || trend.length === 0) {
    container.innerHTML = '<div class="chart-empty">暂无趋势数据</div>';
    return;
  }

  // 最多显示最近 48 个小时
  const data = trend.slice(-48);
  const maxCount = Math.max(...data.map(d => d.count), 1);

  container.innerHTML = data.map(d => {
    const height = Math.max((d.count / maxCount) * 100, 2);
    const label = `${formatHour(d.hourBucket)} | ${d.count}条`;
    return `<div class="chart-bar" style="height:${height}%;" data-label="${label}"></div>`;
  }).join('');
}

// ===== 渲染分页 =====
function renderPagination() {
  const totalPages = Math.ceil(totalRecords / currentPageSize);
  const info = document.getElementById('pageInfo');
  const btns = document.getElementById('pageButtons');

  const start = totalRecords === 0 ? 0 : (currentPage - 1) * currentPageSize + 1;
  const end = Math.min(currentPage * currentPageSize, totalRecords);
  info.textContent = `共 ${totalRecords} 条 | 显示 ${start}-${end} | 第 ${currentPage}/${totalPages || 1} 页`;

  let html = '';
  html += `<button class="page-btn" ${currentPage <= 1 ? 'disabled' : ''} onclick="loadData(${currentPage - 1})">‹</button>`;

  const maxBtns = 7;
  let startPage = Math.max(1, currentPage - 3);
  let endPage = Math.min(totalPages, startPage + maxBtns - 1);
  if (endPage - startPage < maxBtns - 1) startPage = Math.max(1, endPage - maxBtns + 1);

  if (startPage > 1) {
    html += `<button class="page-btn" onclick="loadData(1)">1</button>`;
    if (startPage > 2) html += `<span class="page-btn" style="border:none;">...</span>`;
  }
  for (let i = startPage; i <= endPage; i++) {
    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="loadData(${i})">${i}</button>`;
  }
  if (endPage < totalPages) {
    if (endPage < totalPages - 1) html += `<span class="page-btn" style="border:none;">...</span>`;
    html += `<button class="page-btn" onclick="loadData(${totalPages})">${totalPages}</button>`;
  }

  html += `<button class="page-btn" ${currentPage >= totalPages ? 'disabled' : ''} onclick="loadData(${currentPage + 1})">›</button>`;
  btns.innerHTML = html;
}

// ===== 导出CSV =====
async function exportCSV() {
  const params = new URLSearchParams();
  params.set('page', 1);
  params.set('size', 1000);

  const st = inputToTs(document.getElementById('startTime').value);
  const et = inputToTs(document.getElementById('endTime').value);
  if (st) params.set('startTime', st);
  if (et) params.set('endTime', et);
  const ev = document.getElementById('eventFilter').value;
  if (ev) params.set('event', ev);
  const aid = document.getElementById('aidFilter').value.trim();
  if (aid) params.set('aid', aid);
  const uid = document.getElementById('uidFilter').value.trim();
  if (uid) params.set('uid', uid);
  const url = document.getElementById('urlFilter').value.trim();
  if (url) params.set('url', url);

  try {
    const res = await fetch(`${API_BASE}/list?${params}`);
    const json = await res.json();
    if (json.code !== 0 || !json.data.list.length) {
      alert('无可导出数据');
      return;
    }

    const headers = ['ID', '时间', 'AID', 'UID', '事件', '事件详情', 'URL', '来源', '屏幕', 'UA', 'Extra'];
    const rows = json.data.list.map(r => [
      r.id, formatTime(r.timestamp), r.aid, r.uid, r.event, r.eventMsg, r.url, r.referrer, r.screen, r.userAgent, r.extra
    ]);

    const csv = [headers, ...rows].map(row =>
      row.map(cell => `"${String(cell || '').replace(/"/g, '""')}"`).join(',')
    ).join('\n');

    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `behavior_log_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
  } catch (e) {
    alert('导出失败: ' + e.message);
  }
}

});

});
