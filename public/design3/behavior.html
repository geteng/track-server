<div class="page">

  <!-- Page Header -->
  <div class="page-header">
    <h1 class="page-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px;display:inline;vertical-align:middle;margin-right:6px;color:var(--blue-deep);"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      用户行为日志
    </h1>
    <div style="margin-left:auto;" class="mascot-bubble">
      <img src="https://xla-persist.xingliu.art/wm/artifacts/agent/2qj4RM9pEKF9gztL.png" alt="mascot" class="mascot-bubble-img" onerror="this.outerHTML='<span style=&quot;font-size:20px;&quot;>✨</span>'">
      <span class="mascot-bubble-text">每个行为都是线索！🔍</span>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <div class="filter-group">
      <div class="filter-label">开始时间</div>
      <input type="datetime-local" class="form-input" id="startTime" style="width:175px;">
    </div>
    <div class="filter-group">
      <div class="filter-label">结束时间</div>
      <input type="datetime-local" class="form-input" id="endTime" style="width:175px;">
    </div>
    <div class="filter-group">
      <div class="filter-label">快捷选择</div>
      <div style="display:flex;gap:5px;">
        <button class="quick-btn" data-h="1">近1小时</button>
        <button class="quick-btn" data-h="24">近24小时</button>
        <button class="quick-btn" data-h="168">近7天</button>
        <button class="quick-btn active" data-h="">全部</button>
      </div>
    </div>
    <div class="filter-group">
      <div class="filter-label">事件类型</div>
      <select class="form-select" id="evSelect" style="width:150px;"><option value="">全部事件</option></select>
    </div>
    <div class="filter-group" style="flex:1;min-width:200px;">
      <div class="filter-label">搜索</div>
      <div class="search-bar" style="width:100%;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="kwInput" placeholder="AID / UID / 页面URL..." style="width:100%;">
      </div>
    </div>
    <div class="filter-group">
      <div class="filter-label">&nbsp;</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary btn-sm" onclick="resetFilter()">重置</button>
        <button class="btn btn-primary btn-sm" onclick="load(1)">🔍 查询</button>
        <button class="btn btn-yellow btn-sm" onclick="exportCSV()">⬇ 导出 CSV</button>
      </div>
    </div>
  </div>

  <!-- Stat Cards + Chart -->
  <div class="stat-chart-row">
    <div class="stat-card">
      <div class="stat-badge" style="background:var(--blue-light);">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--blue-deep)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
      <div class="stat-value" id="stTotal">—</div>
      <div class="stat-label">总日志条数</div>
    </div>
    <div class="stat-card">
      <div class="stat-badge" style="background:var(--green-light);">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--green-deep)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="stat-value" id="stUv">—</div>
      <div class="stat-label">独立访客 UV</div>
    </div>
    <div class="stat-card">
      <div class="stat-badge" style="background:var(--yellow-light);">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--yellow-deep)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <div class="stat-value" id="stPv">—</div>
      <div class="stat-label">页面浏览量 PV</div>
    </div>
    <div class="stat-card">
      <div class="stat-badge" style="background:var(--purple-light);">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--purple-deep)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <div class="stat-value" style="font-size:16px;line-height:1.4;" id="stTopEv">—</div>
      <div class="stat-label" id="stTopEvLb">TOP 事件</div>
    </div>
    <!-- Candy Bar Chart -->
    <div class="card" style="padding:20px;">
      <div class="chart-title">📊 事件分布 <span class="tag tag-info" style="font-size:11px;" id="chartRange">全部</span></div>
      <div class="candy-chart" id="trendWrap"></div>
      <div style="display:flex;justify-content:space-between;margin-top:6px;">
        <span style="font-size:10px;font-weight:700;color:var(--fg-3);">最早</span>
        <span style="font-size:10px;font-weight:700;color:var(--fg-3);">最新</span>
      </div>
    </div>
  </div>

  <!-- Log Table -->
  <div class="table-outer">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--card);border-bottom:2px solid var(--stroke);">
      <div style="font-size:16px;font-weight:800;color:var(--fg);">📋 行为日志列表</div>
      <span style="font-size:13px;font-weight:600;color:var(--fg-2);" id="listCnt">共 - 条</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>时间</th><th>AID</th><th>UID</th><th>事件</th>
            <th>事件详情</th><th>页面 URL</th><th>设备</th><th style="text-align:right;">操作</th>
          </tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="9"><div class="loading"><span class="spinner"></span>加载中…</div></td></tr></tbody>
      </table>
    </div>
    <div class="pager">
      <span class="pager-info" id="pageInfo">-</span>
      <div class="pager-btns" id="pageBtns"></div>
    </div>
  </div>

</div>

<!-- 详情 Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal" style="width:640px;max-width:92vw;">
    <div class="modal-header">
      <div class="modal-title">🔎 日志详情</div>
      <div class="modal-close" onclick="document.getElementById('detailModal').classList.remove('open')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
    </div>
    <div class="modal-body" id="detailBody" style="max-height:70vh;overflow:auto;">-</div>
  </div>
</div>

<script>
const PAGE = 20;
let curPage = 1;
const CANDY = ['#FFE9F1','#FFD3E4','#FF7BAC','#F0568C','#7ED957','#5AC8FA','#FFC53D','#B58CFF'];

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDT(ts){ const d = new Date(ts); const p = x => String(x).padStart(2,'0'); return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }

const EV_MAP = {
  'page_view':'页面浏览','item_view':'浏览商品','item_click':'点击商品','add_to_cart':'加购','collect':'收藏','share':'分享',
  'submit_order':'提交订单','pay_success':'支付成功','stay_duration':'停留','search':'搜索','user_login':'登录','form_submit':'提交表单',
  'click_element':'点击元素','click_nav':'点击导航','tab_switch':'切换Tab','click_button':'点击按钮','btn_click_tryon':'AI试穿',
  'click_buy':'点击购买','click_vip_plan':'点击会员方案','btn_click_customize':'开始定制','btn_click_look':'查看穿搭','btn_click_note':'写笔记',
  'customize_collect_look':'定制收藏','customize_consult_open':'打开咨询','customize_consult_close':'关闭咨询','customize_page_view':'定制页浏览','customize_page_leave':'离开定制页',
  'error_event':'异常事件','btn_click_upload':'上传照片','tryon_complete':'试穿完成','outfit_generate':'生成穿搭'
};
function evLabel(e){ return EV_MAP[e] || e; }
function evCls(e){
  const s = String(e);
  if (/(pay|order|buy|collect|favorite|share|cart|vip|consult)/i.test(s)) return 'event-add_favorite';
  if (/tryon|customize|outfit|note/i.test(s)) return 'event-ai_try_on';
  if (/page_view|pageview/i.test(s)) return 'event-page_view';
  if (/search/i.test(s)) return 'event-search';
  if (/click|nav|tab|button|element/i.test(s)) return 'event-scene_switch';
  return 'event-search';
}
function deviceOf(ua){
  ua = ua || '';
  if (/iPhone|iPad/i.test(ua)) return '🍎 iOS';
  if (/Android/i.test(ua)) return '🤖 Android';
  if (/MicroMessenger/i.test(ua)) return '💬 微信';
  return '💻 PC';
}

async function loadEvents() {
  try {
    const j = await fetch('/api/behavior-log/events').then(r => r.json());
    const evs = Array.isArray(j.data) ? j.data : [];
    document.getElementById('evSelect').innerHTML = '<option value="">全部事件</option>' + evs.map(e => '<option value="' + esc(e) + '">' + esc(evLabel(e)) + '（' + esc(e) + '）</option>').join('');
  } catch (e) {}
}

document.querySelectorAll('.quick-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.quick-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const h = Number(b.dataset.h);
    const end = new Date(), start = new Date(end.getTime() - h * 3600 * 1000);
    const p2 = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + 'T' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    if (h) { document.getElementById('startTime').value = p2(start); document.getElementById('endTime').value = p2(end); document.getElementById('chartRange').textContent = h >= 24 ? ('近' + (h / 24) + '天') : ('近' + h + '小时'); }
    else { document.getElementById('startTime').value = ''; document.getElementById('endTime').value = ''; document.getElementById('chartRange').textContent = '全部'; }
    load(1);
  });
});

function buildParams(page) {
  const p = new URLSearchParams({ page, size: PAGE });
  const st = document.getElementById('startTime').value, et = document.getElementById('endTime').value;
  if (st) p.set('startTime', new Date(st).getTime());
  if (et) p.set('endTime', new Date(et).getTime());
  const ev = document.getElementById('evSelect').value; if (ev) p.set('event', ev);
  const kw = document.getElementById('kwInput').value.trim();
  if (kw) {
    if (/^[0-9a-f]{8,}$/i.test(kw)) p.set('aid', kw);
    else if (/^\d+$/.test(kw)) p.set('uid', kw);
    else p.set('url', kw);
  }
  return p;
}
function resetFilter() {
  document.querySelectorAll('.quick-btn').forEach(x => x.classList.toggle('active', x.dataset.h === ''));
  document.getElementById('startTime').value = ''; document.getElementById('endTime').value = '';
  document.getElementById('chartRange').textContent = '全部';
  document.getElementById('evSelect').value = '';
  document.getElementById('kwInput').value = '';
  load(1);
}

async function load(page) {
  if (page) curPage = page;
  const p = buildParams(curPage);
  const tb = document.getElementById('tbody');
  tb.innerHTML = '<tr><td colspan="9"><div class="loading"><span class="spinner"></span>加载中…</div></td></tr>';
  try {
    const j = await fetch('/api/behavior-log/list?' + p).then(r => r.json());
    const d = j.data || { list: [], total: 0 };
    const list = d.list || [], total = d.total || 0, pages = Math.max(1, Math.ceil(total / PAGE));
    const stats = d.stats || {};

    document.getElementById('stTotal').textContent = Number(stats.total || total).toLocaleString();
    document.getElementById('stUv').textContent = stats.uniqueUsers != null ? stats.uniqueUsers : '—';
    document.getElementById('stPv').textContent = stats.pvCount != null ? stats.pvCount.toLocaleString() : '—';
    const top = (stats.topEvents || [])[0];
    document.getElementById('stTopEv').textContent = top ? evLabel(top.event) : '—';
    document.getElementById('stTopEvLb').textContent = top ? ('TOP 事件（' + top.count + ' 次）') : 'TOP 事件';

    const trend = d.trend || [];
    const last48 = trend.slice(-48);
    const maxC = Math.max(1, ...last48.map(t => t.count));
    const divs = document.querySelectorAll('.candy-chart');
    const wrap = document.getElementById('trendWrap');
    wrap.innerHTML = last48.length
      ? last48.map((t, i) => {
          const hgt = Math.max(6, Math.round((t.count / maxC) * 52));
          const c = CANDY[Math.round(((t.count / maxC) * 7))] || CANDY[0];
          return '<div class="candy-bar" title="' + fmtDT(t.hourBucket) + ' · ' + t.count + ' 次" style="height:' + hgt + 'px;background:' + c + ';"></div>';
        }).join('')
      : '<div class="empty" style="width:100%;">暂无数据</div>';

    document.getElementById('listCnt').textContent = '共 ' + total.toLocaleString() + ' 条';
    if (!list.length) {
      tb.innerHTML = '<tr><td colspan="9"><div class="empty">没有符合条件的日志 🎈</div></td></tr>';
    } else {
      tb.innerHTML = list.map(r => `
        <tr class="row-click" onclick="showDetail(${r.id})">
          <td class="mono">#${r.id}</td>
          <td style="white-space:nowrap;font-size:12px;font-weight:700;color:var(--fg-2);">${fmtDT(r.timestamp)}</td>
          <td class="mono">${esc(r.aid || '—')}</td>
          <td class="mono">${esc(r.uid || '—')}</td>
          <td><span class="event-tag ${evCls(r.event)}">${esc(evLabel(r.event))}</span></td>
          <td style="font-size:12px;font-weight:700;">${esc(r.eventMsg || '—')}</td>
          <td><div class="url-cell" style="max-width:220px;" title="${esc(r.url || '')}">${esc((r.url || '').replace(/^https?:\/\//, '') || '—')}</div></td>
          <td style="white-space:nowrap;">${deviceOf(r.userAgent)}</td>
          <td style="text-align:right;"><button class="btn btn-secondary btn-xs" onclick="event.stopPropagation();showDetail(${r.id})">详情</button></td>
        </tr>`).join('');
    }

    document.getElementById('pageInfo').textContent = '共 ' + total.toLocaleString() + ' 条 · 第 ' + curPage + '/' + pages + ' 页';
    let btns = '<button class="page-btn" onclick="load(' + (curPage - 1) + ')" ' + (curPage <= 1 ? 'disabled' : '') + '>‹</button>';
    for (let i = 1; i <= pages; i++) {
      if (pages > 9 && i > 1 && i < pages && Math.abs(i - curPage) > 2) continue;
      btns += '<button class="page-btn ' + (i === curPage ? 'active' : '') + '" onclick="load(' + i + ')">' + i + '</button>';
    }
    btns += '<button class="page-btn" onclick="load(' + (curPage + 1) + ')" ' + (curPage >= pages ? 'disabled' : '') + '>›</button>';
    document.getElementById('pageBtns').innerHTML = btns;
  } catch (e) {
    tb.innerHTML = '<tr><td colspan="9"><div class="empty">加载失败：' + esc(e.message) + '</div></td></tr>';
  }
}

async function showDetail(id) {
  document.getElementById('detailBody').innerHTML = '<div class="loading"><span class="spinner"></span>加载中…</div>';
  document.getElementById('detailModal').classList.add('open');
  try {
    const j = await fetch('/api/behavior-log/' + id).then(r => r.json());
    if (j.code !== 0) throw new Error(j.msg || '记录不存在');
    const d = j.data || {};
    let extraHtml = '';
    try {
      const ex = JSON.parse(d.extra || '{}');
      extraHtml = Object.entries(ex).map(([k, v]) => '<div><span class="k">' + esc(k) + '：</span><span class="v">' + esc(typeof v === 'object' ? JSON.stringify(v) : v) + '</span></div>').join('');
    } catch (e) { extraHtml = '<div><span class="k">extra：</span><span class="v">' + esc(d.extra || '—') + '</span></div>'; }
    document.getElementById('detailBody').innerHTML = `
      <div class="kv">
        <div><span class="k">记录 ID：</span><span class="v mono">#${d.id}</span></div>
        <div><span class="k">时间：</span><span class="v">${fmtDT(d.timestamp)}</span></div>
        <div><span class="k">AID：</span><span class="v mono">${esc(d.aid || '—')}</span></div>
        <div><span class="k">UID：</span><span class="v mono">${esc(d.uid || '—')}</span></div>
        <div class="divider"></div>
        <div><span class="k">事件：</span><span class="v"><span class="event-tag ${evCls(d.event)}">${esc(evLabel(d.event))}</span> <span class="text-muted fs-12">${esc(d.eventMsg || '')}</span></span></div>
        <div><span class="k">页面 URL：</span><span class="v">${esc(d.url || '—')}</span></div>
        <div><span class="k">来源：</span><span class="v">${esc(d.referrer || '—')}</span></div>
        <div><span class="k">屏幕：</span><span class="v">${esc(d.screen || '—')}</span></div>
        <div><span class="k">设备：</span><span class="v">${deviceOf(d.userAgent)} · <span class="mono">${esc((d.userAgent || '').slice(0, 80))}</span></span></div>
        <div class="divider"></div>
        ${extraHtml}
      </div>`;
  } catch (e) {
    document.getElementById('detailBody').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}
document.getElementById('detailModal').addEventListener('click', e => { if (e.target.id === 'detailModal') e.currentTarget.classList.remove('open'); });

async function exportCSV() {
  try {
    const p = buildParams(1); p.set('size', 1000); p.set('page', 1);
    const j = await fetch('/api/behavior-log/list?' + p).then(r => r.json());
    const list = (j.data && j.data.list) || [];
    if (!list.length) { alert('没有可导出的数据'); return; }
    const head = 'ID,时间,AID,UID,事件,事件详情,URL,来源,屏幕';
    const rows = list.map(r => [r.id, fmtDT(r.timestamp), r.aid || '', r.uid || '', evLabel(r.event), (r.eventMsg || '').replace(/,/g, '，'), r.url || '', r.referrer || '', r.screen || ''].join(','));
    const blob = new Blob(['\ufeff' + head + '\n' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '行为日志_' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click(); URL.revokeObjectURL(a.href);
  } catch (e) { alert('导出失败：' + e.message); }
}

loadEvents();
load(1);
</script>
</body>
</html>
